<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trade Journal</title>
  <style>
    :root {
      --bg: #020617; --panel: #0f172a; --panel2: #0a1628; --line: #1e293b; --line2: #334155;
      --text: #e2e8f0; --muted: #64748b; --dim: #94a3b8; --accent: #7dd3fc; --blue: #1d4ed8;
      --green: #22c55e; --red: #ef4444; --orange: #f97316; --amber: #f59e0b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); font-family: 'Inter', system-ui, sans-serif; color: var(--text); font-size: 14px; }
    button, input, select, textarea { font-family: inherit; font-size: 13px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .inp { background: #1e293b; border: 1px solid var(--line2); color: #f8fafc; border-radius: 6px; padding: 7px 10px; outline: none; }
    .inp:focus { border-color: var(--accent); }
    textarea.inp { width: 100%; resize: vertical; line-height: 1.6; }

    .btn { background: #1e293b; color: var(--accent); border: 1px solid var(--line2); border-radius: 6px; padding: 5px 12px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .btn:hover:not(:disabled) { border-color: currentColor; }
    .btn.primary { background: var(--blue); color: #fff; border-color: var(--blue); padding: 7px 18px; font-size: 13px; }
    .btn.danger { color: #f87171; }
    .btn.warn { color: var(--amber); }
    .btn.ghost { color: var(--dim); }
    .btn.small { padding: 2px 8px; font-size: 11px; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }

    .header { position: sticky; top: 0; z-index: 100; background: var(--bg); border-bottom: 1px solid var(--line); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .brand { font-family: monospace; font-size: 17px; font-weight: 800; color: var(--accent); letter-spacing: 1px; }
    .count { font-size: 12px; color: var(--dim); background: var(--line); padding: 2px 8px; border-radius: 10px; margin-left: 10px; }
    .wrap { max-width: 920px; margin: 0 auto; padding: 20px 16px 60px; }
    .wrap.wide { max-width: 1240px; }

    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
    .toolbar .search { flex: 1 1 200px; }

    .error { background: #450a0a; border: 1px solid #f87171; border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; color: #fca5a5; font-size: 13px; display: flex; justify-content: space-between; gap: 10px; }
    .empty { color: var(--muted); text-align: center; padding: 60px 0; line-height: 2; }

    .group-head { display: flex; align-items: center; gap: 10px; margin: 26px 0 10px; }
    .group-head:first-child { margin-top: 0; }
    .group-head .name { font-family: monospace; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 1px; }
    .group-head .rule { flex: 1; height: 1px; background: var(--line); }
    .group-head .n { font-size: 11px; color: var(--muted); }

    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
    .card.open { border-color: var(--line2); }
    .card-head { display: flex; align-items: center; gap: 10px; padding: 11px 16px; cursor: pointer; flex-wrap: wrap; }
    .card-head:hover { background: #111c33; }
    .ticker { font-family: monospace; font-weight: 700; font-size: 15px; color: #f8fafc; min-width: 64px; }
    .date { font-size: 12px; color: var(--muted); }
    .tfs { display: inline-flex; gap: 4px; }
    .pill { font-size: 10px; padding: 1px 7px; border-radius: 10px; }
    .head-right { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); }
    .chev { color: #475569; font-size: 11px; }

    .tf { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 20px; padding: 0 6px; border-radius: 4px; font-size: 11px; font-weight: 700; border: 1px solid; }
    .tf.big { height: 24px; padding: 0 10px; font-size: 12px; }
    .bias { color: #fff; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; letter-spacing: .5px; }
    .tag { background: #1e293b; color: var(--accent); font-size: 11px; padding: 2px 8px; border-radius: 4px; border: 1px solid var(--line2); }

    .body { padding: 0 16px 16px; border-top: 1px solid var(--line); }
    .levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 12px 16px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; margin-top: 14px; }
    .lv-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
    .lv-val { font-family: monospace; font-size: 16px; font-weight: 700; color: #f8fafc; }
    .lv-sub { font-size: 10px; color: var(--orange); }
    .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }

    .tl-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 18px 0 12px; }
    .tl-title { font-size: 12px; color: var(--dim); font-weight: 600; margin-right: 4px; }
    .chip { background: #1e293b; color: var(--dim); border: 1px solid var(--line2); border-radius: 14px; padding: 3px 11px; font-size: 11px; font-weight: 600; cursor: pointer; }
    .chip.on { color: #0b1020; background: var(--c, var(--accent)); border-color: var(--c, var(--accent)); }

    .tl-item { border-left: 3px solid var(--c, var(--line2)); padding: 2px 0 2px 14px; margin-bottom: 20px; }
    .tl-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
    .tl-date { font-size: 11px; color: var(--muted); }

    .tl-actions { margin-left: auto; display: flex; gap: 6px; }
    .note { white-space: pre-wrap; color: #cbd5e1; font-size: 13px; line-height: 1.65; }
    .note b { color: #f8fafc; font-weight: 700; }
    .note i { color: #e2e8f0; }
    .fmt-bar { display: flex; align-items: center; gap: 4px; margin-bottom: 4px; }
    .fmt-btn { background: #1e293b; color: var(--dim); border: 1px solid var(--line2); border-radius: 5px; width: 28px; height: 24px; font-size: 13px; cursor: pointer; }

    .shot { width: 100%; border-radius: 6px; margin-top: 8px; border: 1px solid var(--line); cursor: zoom-in; display: block; }

    .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
    .usage { margin-left: auto; font-size: 11px; color: var(--muted); }

    .form.sub { background: #0f1f35; border-color: #1e3a5f; border-radius: 8px; padding: 16px; margin-top: 12px; }
    .form h3 { font-size: 15px; font-weight: 700; margin-bottom: 18px; color: #f8fafc; }
    .form.sub h3 { font-size: 13px; color: var(--accent); margin-bottom: 12px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; align-items: flex-end; }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field > label { font-size: 11px; color: var(--muted); font-weight: 600; }
    .hint { font-size: 11px; color: var(--muted); }
    .form-actions { display: flex; gap: 10px; align-items: center; }

    .seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 6px; overflow: hidden; flex-wrap: wrap; }
    .seg button { background: #1e293b; color: var(--dim); border: 0; border-right: 1px solid var(--line2); padding: 6px 11px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .seg button:last-child { border-right: 0; }

    .drop { border: 1px dashed var(--line2); border-radius: 8px; padding: 14px; text-align: center; color: var(--dim); font-size: 12px; cursor: pointer; }
    .drop:hover, .drop.over { border-color: var(--accent); color: var(--accent); }
    .drop.has { border-style: solid; border-color: #22c55e88; color: var(--green); }
    .thumb-row { display: flex; align-items: flex-start; gap: 10px; margin-top: 10px; }
    .thumb { max-height: 180px; max-width: 100%; border-radius: 6px; border: 1px solid var(--line); }

    .move { background: var(--panel2); border: 1px solid var(--line2); border-radius: 8px; padding: 12px; margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }

    .tablink { color: var(--dim); text-decoration: none; font-size: 12px; border: 1px solid var(--line2); border-radius: 5px; padding: 1px 7px; }
    .tablink:hover { color: var(--accent); border-color: var(--accent); }
    .crumb { color: var(--dim); text-decoration: none; font-size: 12px; margin-left: 12px; }
    .crumb:hover { color: var(--accent); }
    .ov-sum { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--dim); margin-bottom: 10px; }
    .ov-sum b { color: #f8fafc; }
    .ov-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
    .ov { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 860px; }
    .ov th { text-align: left; font-size: 11px; color: var(--muted); font-weight: 600; padding: 9px 10px; border-bottom: 1px solid var(--line2); white-space: nowrap; background: var(--panel2); position: sticky; top: 0; }
    .ov th.sort { cursor: pointer; }
    .ov th.sort:hover, .ov th.on { color: var(--accent); }
    .ov td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    .ov tr:last-child td { border-bottom: 0; }
    .ov tbody tr { cursor: pointer; }
    .ov tbody tr:hover td { background: #111c33; }
    .ov .num { font-family: monospace; white-space: nowrap; }
    .ov .sub { display: block; font-size: 11px; color: var(--muted); font-family: monospace; }
    .ov .last { color: #cbd5e1; font-size: 12px; line-height: 1.45; max-width: 300px; }
    .st { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
    .spark { display: block; }
    .heat { font-family: monospace; white-space: nowrap; font-weight: 600; text-align: right; }
    .ov th.r { text-align: right; }
    .sec-name { display: block; font-size: 11px; color: var(--muted); }
    .bench td { background: #13213a; border-top: 1px solid #38bdf8aa; border-bottom: 1px solid #38bdf8aa; }
    .lightbox { position: fixed; inset: 0; background: rgba(2, 6, 23, .94); display: flex; align-items: center; justify-content: center; z-index: 300; padding: 16px; cursor: zoom-out; }
    .lightbox img { max-width: 100%; max-height: 100%; border-radius: 6px; }

    @media (max-width: 600px) {
      .header { padding: 10px 12px; }
      .head-right .levels-mini { display: none; }
    }
  </style>

<div id="root"></div>
<script type="module">
import React, { useState, useEffect, useLayoutEffect, useRef } from "https://esm.sh/react@18";

import htm from "https://esm.sh/htm@3";
const html = htm.bind(React.createElement);

// ─── Firebase ─────────────────────────────────────────────────────────────────
let db, fbFn;
async function initFirebase() {
  if (db) return;
  const { initializeApp, getApps } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");

    await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
  const config = {
    apiKey: "AIzaSyBTCiLlyhz79vDB4AaROQgDwxNrjI7fmLM",
    authDomain: "investment-journal-ac26f.firebaseapp.com",
    projectId: "investment-journal-ac26f",
    storageBucket: "investment-journal-ac26f.firebasestorage.app",
    messagingSenderId: "688873767307",
    appId: "1:688873767307:web:bb95b34f7210056b27af8e"
  };
  const app = getApps().length ? getApps()[0] : initializeApp(config);
  db = getFirestore(app);
  fbFn = { collection, addDoc, getDocs, deleteDoc, doc, updateDoc, query, orderBy };

// ─── Live koersen ─────────────────────────────────────────────────────────────
// Plak hier de URL van je Cloudflare Worker (zie koers-worker.js).
// Leeg laten = enkel Amerikaanse aandelen via Finnhub.
const QUOTE_PROXY = "https://koers.j-cauberghe.workers.dev";
const FINNHUB_KEY = "d8o37fpr01qvtr6m81f0d8o37fpr01qvtr6m81fg";

// Beurs → Yahoo-suffix en standaardvaluta
const EXCHANGES = [
  { id: "US", label: "VS (NYSE/Nasdaq)", suffix: "", currency: "USD" },
  { id: "DE", label: "Xetra / Frankfurt", suffix: ".DE", currency: "EUR" },
  { id: "AS", label: "Euronext Amsterdam", suffix: ".AS", currency: "EUR" },
  { id: "BR", label: "Euronext Brussel", suffix: ".BR", currency: "EUR" },
  { id: "PA", label: "Euronext Parijs", suffix: ".PA", currency: "EUR" },
  { id: "MI", label: "Milaan", suffix: ".MI", currency: "EUR" },
  { id: "L", label: "Londen", suffix: ".L", currency: "GBP" },
  { id: "SW", label: "Zwitserland (SIX)", suffix: ".SW", currency: "CHF" },
  { id: "BK", label: "Bangkok (SET)", suffix: ".BK", currency: "THB" },
  { id: "HK", label: "Hongkong", suffix: ".HK", currency: "HKD" },
  { id: "T", label: "Tokio", suffix: ".T", currency: "JPY" },
  { id: "TO", label: "Toronto", suffix: ".TO", currency: "CAD" },
];
const exchangeOf = e => EXCHANGES.find(x => x.id === (e.exchange || "US")) || EXCHANGES[0];
// Grondstoffen, indexen en forex → Yahoo-symbool (anders vindt Yahoo een aandeel of niets)
const SYMBOL_ALIASES = {
  WTI: "CL=F", USOIL: "CL=F", CRUDE: "CL=F",
  BRENT: "BZ=F", UKOIL: "BZ=F",
  XAUUSD: "GC=F", GOLD: "GC=F",
  XAGUSD: "SI=F", SILVER: "SI=F",
  XPTUSD: "PL=F", COPPER: "HG=F", NATGAS: "NG=F",
  DXY: "DX-Y.NYB",
  HSI: "^HSI", SPX: "^GSPC", NDX: "^NDX", DJI: "^DJI", VIX: "^VIX", DAX: "^GDAXI", BEL20: "^BFX",
};
const FX = ["USD", "EUR", "JPY", "GBP", "CHF", "CAD", "AUD", "NZD", "HKD", "THB", "CNY", "SEK", "NOK"];
function yahooSymbol(e) {
  const ex = exchangeOf(e);
  const t = e.ticker.trim().toUpperCase();
  if (ex.id === "US") {
    if (SYMBOL_ALIASES[t]) return SYMBOL_ALIASES[t];
    if (/^[A-Z]{6}$/.test(t) && FX.includes(t.slice(0, 3)) && FX.includes(t.slice(3))) return t + "=X"; // USDJPY → USDJPY=X
  }
  return ex.id === "US" ? t.replace(/\./g, "-") : t + ex.suffix; // BRK.B → BRK-B, EXV1 → EXV1.DE
}

const quoteCache = {};
async function fetchQuote(e) {
  const ex = exchangeOf(e);
  const key = ex.id + ":" + e.ticker;
  if (quoteCache[key] && Date.now() - quoteCache[key].ts < 60000) return quoteCache[key].data;
  let data = null;
  try {
    if (QUOTE_PROXY) {
      const r = await fetch(`${QUOTE_PROXY}?symbol=${encodeURIComponent(yahooSymbol(e))}`);
      const d = await r.json();
      if (r.ok && d.price) data = { price: d.price, currency: d.currency, high52: d.high52 ?? null, low52: d.low52 ?? null };
    } else if (ex.id === "US") {
      const [q, m] = await Promise.all([
        fetch(`https://finnhub.io/api/v1/quote?symbol=${e.ticker}&token=${FINNHUB_KEY}`).then(r => r.json()),
        fetch(`https://finnhub.io/api/v1/stock/metric?symbol=${e.ticker}&metric=all&token=${FINNHUB_KEY}`).then(r => r.json())
      ]);
      if (q.c > 0) data = { price: q.c, currency: "USD", high52: m.metric?.["52WeekHigh"] ?? null, low52: m.metric?.["52WeekLow"] ?? null };
    }
  } catch (_) {}
  quoteCache[key] = { data, ts: Date.now() };
  return data;
}

// Dagslotkoersen (±2 jaar) via de koers-worker → EMA 15 / EMA 50 op de daggrafiek
const histCache = {};
async function fetchHistory(e) {
  const ex = exchangeOf(e);
  const key = ex.id + ":" + e.ticker;
  if (histCache[key] && Date.now() - histCache[key].ts < 15 * 60000) return histCache[key].data;
  let data = { status: "error" };
  if (QUOTE_PROXY) {
    try {
      const r = await fetch(`${QUOTE_PROXY}?symbol=${encodeURIComponent(yahooSymbol(e))}&history=1`);
      const d = await r.json();
      if (r.ok && Array.isArray(d.closes)) data = { status: "ok", closes: d.closes.filter(v => typeof v === "number" && isFinite(v)), price: d.price ?? null, currency: d.currency };
      else if (r.ok && d.price) data = { status: "oldworker" }; // worker kent ?history=1 nog niet
    } catch (_) {}
  } else data = { status: "noproxy" };
  histCache[key] = { data, ts: Date.now() };
  return data;
}

// EMA zoals TradingView: start met SMA van de eerste n slotkoersen
function emaSeries(values, n) {
  if (values.length < n) return null;
  const k = 2 / (n + 1);
  let e = values.slice(0, n).reduce((a, b) => a + b, 0) / n;
  const out = new Array(n - 1).fill(null);
  out.push(e);
  for (let i = n; i < values.length; i++) { e = values[i] * k + e * (1 - k); out.push(e); }
  return out;
}
function emaTrend(closes) {
  const e15 = emaSeries(closes, 15), e50 = emaSeries(closes, 50);
  if (!e15 || !e50) return null;
  const last = closes.length - 1;
  const bull = e15[last] > e50[last];
  let bars = 0; // aantal dagen sinds de laatste kruising
  for (let i = last; i >= 49 && (e15[i] > e50[i]) === bull; i--) bars++;
  const crossed = bars < last - 48; // kruising binnen de beschikbare data
  return { ema15: e15[last], ema50: e50[last], bull, bars: crossed ? bars : null, spread: (e15[last] - e50[last]) / e50[last] * 100 };
}

// ─── Constants & helpers ──────────────────────────────────────────────────────
const BIASES = ["Bullish", "Bearish", "Neutral"];
const BIAS_COLOR = { Bullish: "#22c55e", Bearish: "#ef4444", Neutral: "#94a3b8" };
const SETUPS = ["Breakout", "Breakdown", "H&S", "Reverse H&S", "Support Test", "Resistance Test",
  "Tweezer Top", "Tweezer Bottom", "Shooting Star", "Hammer", "Range",
  "Bollinger Squeeze", "MA Cross", "DMI/ADX", "VIX Signal", "Other"];
const TIMEFRAMES = [
  { id: "1M", label: "Maand", short: "M", color: "#a78bfa" },
  { id: "1W", label: "Week", short: "W", color: "#38bdf8" },
  { id: "1D", label: "Dag", short: "D", color: "#34d399" },
  { id: "4H", label: "4 uur", short: "4H", color: "#fbbf24" },
  { id: "1H", label: "1 uur", short: "1H", color: "#f472b6" },
];
// Oude waarden uit de vorige versie omzetten
const LEGACY_TF = { Monthly: "1M", Weekly: "1W", Daily: "1D" };
const normTf = t => !t ? null : (LEGACY_TF[t] || (TIMEFRAMES.some(x => x.id === t) ? t : null));
const tfInfo = t => TIMEFRAMES.find(x => x.id === normTf(t)) || null;

const CURRENCIES = { USD: "$", EUR: "€", GBP: "£", CHF: "CHF ", THB: "฿", HKD: "HK$", JPY: "¥", CAD: "C$" };
const SYMBOLS = { ...CURRENCIES, GBp: "p " }; // Londen noteert soms in pence
const money = (v, cur) => {
  const n = parseFloat(v);
  return isNaN(n) ? "—" : `${SYMBOLS[cur] ?? (cur ? cur + " " : "$")}${n.toFixed(2)}`;
};
function formatDate(isoStr) {
  if (!isoStr) return "";
  const [y, m, d] = isoStr.slice(0, 10).split("-");
  return `${d}/${m}/${y}`;
}
function formatDateTime(iso) {
  if (!iso) return "";
  if (iso.length <= 10) return formatDate(iso);
  return new Date(iso).toLocaleDateString("nl-BE", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
}
function pct(a, b) {
  if (!a || !b || isNaN(a) || isNaN(b)) return null;
  return ((b - a) / a * 100).toFixed(2);
}
const signed = p => p === null ? "—" : `${parseFloat(p) >= 0 ? "+" : ""}${p}%`;

// Firestore laat max 1 MiB per document toe; screenshots zitten in het document.
const DOC_LIMIT = 1000000;
const docBytes = obj => new Blob([JSON.stringify(obj)]).size;
function checkSize(obj) {
  const n = docBytes(obj);
  if (n > DOC_LIMIT) throw new Error(`Deze entry wordt te groot (${Math.round(n / 1024)} KB, max ~980 KB). Verwijder een oude screenshot of start een nieuwe entry voor deze ticker.`);
}

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 1200 / img.width);
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      resolve(c.toDataURL("image/jpeg", 0.75));
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}
const imageFromPaste = e => [...(e.clipboardData?.items || [])].find(i => i.type.startsWith("image/"))?.getAsFile() || null;

// Alle charts van een entry als één tijdlijn (startanalyse + updates)
function timelineOf(e) {
  const items = [{ kind: "main", idx: -1, date: e.createdAt || e.date, tf: normTf(e.timeframe), bias: e.bias, note: e.note, imageData: e.imageData }];
  (e.updates ?? []).forEach((u, i) => items.push({ kind: "update", idx: i, date: u.date, tf: normTf(u.timeframe), bias: u.bias || null, note: u.note, imageData: u.imageData }));
  return items.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
}
const lastActivity = e => timelineOf(e)[0]?.date || e.date || "";
const currentBias = e => timelineOf(e).find(i => i.bias)?.bias || e.bias;
const tfsOf = e => TIMEFRAMES.filter(t => timelineOf(e).some(i => i.tf === t.id)).map(t => t.id);

// ?ticker=BRK.B in de URL → enkel die ticker tonen (apart tabblad)
const URL_TICKER = (new URLSearchParams(location.search).get("ticker") || "").trim().toUpperCase() || null;
const tickerUrl = t => `${location.pathname}?ticker=${encodeURIComponent(t)}`;
function TabLink({ ticker }) {
  return html`<a className="tablink" href=${tickerUrl(ticker)} target="_blank" rel="noopener"
    title=${`${ticker} openen in nieuw tabblad`} onClick=${e => e.stopPropagation()}>↗</a>`;
}

// Richting van de trade: target onder instap = short
function isShort(e) {
  const p = parseFloat(e.price), t = parseFloat(e.target);
  if (p && t) return t < p;
  return e.bias === "Bearish";
}
function pnlNum(e, live) {
  const p = parseFloat(e.price);
  if (!p || !live) return null;
  const r = (live - p) / p * 100;
  return isShort(e) ? -r : r;
}
function statusOf(e, live) {
  if (!live) return null;
  const inv = parseFloat(e.invalidation), t = parseFloat(e.target);
  if (inv && ((e.invalidationDir || "onder") === "onder" ? live < inv : live > inv)) return "invalid";
  if (t && (isShort(e) ? live <= t : live >= t)) return "target";
  if (inv && Math.abs((inv - live) / live * 100) < 3) return "near";
  return "active";
}
const STATUS = {
  invalid: { label: "⚠ Ongeldig", color: "#fca5a5", bg: "#450a0a" },
  target: { label: "🎯 Target", color: "#86efac", bg: "#052e16" },
  near: { label: "Dicht bij invalidation", color: "#fcd34d", bg: "#3b2a0a" },
  active: { label: "Actief", color: "#94a3b8", bg: "#1e293b" },
};

    style=${{ color: t.color, borderColor: t.color + "66", background: t.color + "1a" }}>${big ? t.label : t.short}</span>`;
}

function ImageDrop({ value, onChange, onFile, required }) {
  const ref = useRef();
  const [over, setOver] = useState(false);
  return html`<div>
    <div className=${"drop" + (value ? " has" : "") + (over ? " over" : "")} tabIndex="0" role="button"
      onClick=${() => ref.current.click()}

      onDragOver=${e => { e.preventDefault(); setOver(true); }}
      onDragLeave=${() => setOver(false)}
      onDrop=${e => { e.preventDefault(); setOver(false); onFile(e.dataTransfer.files[0]); }}>
      ${value ? "✓ Screenshot geladen. Klik, sleep of plak om te vervangen." : `📎 Klik, sleep of plak (Ctrl+V) een screenshot${required ? " *" : ""}`}

      onChange=${e => { onFile(e.target.files[0]); e.target.value = ""; }} />
    ${value && html`<div className="thumb-row">
      <img src=${value} className="thumb" alt="Voorbeeld" />
      <button type="button" className="btn danger small" onClick=${() => onChange("")}>✕ Verwijder</button>
    </div>`}
  </div>`;
}

// Gemeenschappelijke logica: screenshot laden via klik, slepen of plakken
function useImage(initial) {
  const [imageData, setImageData] = useState(initial || "");
  async function takeFile(file) {
    if (!file || !file.type.startsWith("image/")) return;
    setImageData(await compressImage(file));
  }
  function onPaste(e) {
    const f = imageFromPaste(e);
    if (f) { e.preventDefault(); takeFile(f); }
  }
  return { imageData, setImageData, takeFile, onPaste };
}

// ─── Opmaak in notities: **vet** en *cursief* ─────────────────────────────────
const FMT_BOLD = String.raw`\*\*(?!\s)((?:\*(?!\s)[^*\n]+?(?<!\s)\*|[^*\n])+?)(?<!\s)\*\*`;
const FMT_ITAL = String.raw`\*(?!\s)((?:\*\*(?!\s)[^*\n]+?(?<!\s)\*\*|[^*\n])+?)(?<!\s)\*`;
const FMT_RE = new RegExp(`${FMT_BOLD}|${FMT_ITAL}`, "g");
function renderInline(text, pre = "") {
  const out = []; let last = 0, i = 0;
  for (const m of text.matchAll(FMT_RE)) {
    if (m.index > last) out.push(text.slice(last, m.index));
    const k = pre + i++;
    out.push(m[1] !== undefined ? html`<b key=${k}>${renderInline(m[1], k + ".")}</b>` : html`<i key=${k}>${renderInline(m[2], k + ".")}</i>`);
    last = m.index + m[0].length;
  }
  if (last < text.length) out.push(text.slice(last));
  return out;
}
const RichNote = ({ text }) => html`<p className="note">${renderInline(text || "")}</p>`;
const plainNote = t => { let s = t || "", p; do { p = s; s = s.replace(FMT_RE, (m, b, i) => b ?? i); } while (s !== p); return s; };

// Tekstvak met knoppen B / I (ook Ctrl+B en Ctrl+I)
function NoteEditor({ value, onChange, placeholder, rows = 3 }) {
  const ref = useRef();
  const pendingSel = useRef(null);
  useLayoutEffect(() => {
    if (pendingSel.current && ref.current) { const [a, b] = pendingSel.current; pendingSel.current = null; ref.current.focus(); ref.current.setSelectionRange(a, b); }
  });
  function wrap(mark) {
    const ta = ref.current; if (!ta) return;
    const v = ta.value, s = ta.selectionStart, e = ta.selectionEnd, n = mark.length;
    const sel = v.slice(s, e);
    let next, ns, ne;
    const lead = str => str.match(/^\**/)[0].length, tail = str => str.match(/\**$/)[0].length;
    const fits = k => k === n || k === 3;                                                      // *x*, **x** of ***x***
    const before = tail(v.slice(0, s)), after = lead(v.slice(e));
    if (sel.length > 2 * n && fits(lead(sel)) && fits(tail(sel)) && lead(sel) < sel.length) {
      next = v.slice(0, s) + sel.slice(n, -n) + v.slice(e); ns = s; ne = e - 2 * n;           // selectie bevat de tekens
    } else if (before >= n && after >= n && fits(before) && fits(after)) {
      next = v.slice(0, s - n) + sel + v.slice(e + n); ns = s - n; ne = e - n;                 // tekens rond de selectie
    } else {
      // spaties aan de randen buiten de opmaak houden
      const ls = sel.match(/^\s*/)[0].length, ts = sel.length - sel.trimEnd().length;
      const core = sel.slice(ls, sel.length - ts);
      next = v.slice(0, s + ls) + mark + core + mark + v.slice(e - ts);
      ns = s + ls + n; ne = ns + core.length;
    }
    pendingSel.current = [ns, ne];
    onChange(next);
  }
  function onKeyDown(ev) {
    if (!(ev.ctrlKey || ev.metaKey) || ev.altKey) return;
    const k = ev.key.toLowerCase();
    if (k === "b") { ev.preventDefault(); wrap("**"); }
    if (k === "i") { ev.preventDefault(); wrap("*"); }
  }
  return html`<div>
    <div className="fmt-bar">
      <button type="button" className="fmt-btn" title="Vet (Ctrl+B)" onMouseDown=${ev => ev.preventDefault()} onClick=${() => wrap("**")}><b>B</b></button>
      <button type="button" className="fmt-btn" title="Cursief (Ctrl+I)" onMouseDown=${ev => ev.preventDefault()} onClick=${() => wrap("*")}><i style=${{ fontFamily: "Georgia, serif" }}>I</i></button>
      <span className="hint" style=${{ marginLeft: 6 }}>Selecteer tekst en klik B of I · **vet** · *cursief*</span>
    </div>
    <textarea ref=${ref} className="inp" rows=${rows} value=${value} onKeyDown=${onKeyDown}
      onChange=${e => onChange(e.target.value)} placeholder=${placeholder} />
  </div>`;
}

// ─── Update form (nieuw of bewerken) ──────────────────────────────────────────
function UpdateForm({ initial, defaultTf, onSave, onCancel }) {
  const [note, setNote] = useState(initial?.note || "");
  const [tf, setTf] = useState(initial ? (normTf(initial.timeframe) || "") : defaultTf);
  const [bias, setBias] = useState(initial?.bias || "");
  const [busy, setBusy] = useState(false);
  const img = useImage(initial?.imageData);
  const ok = (note.trim() || img.imageData) && tf;

  async function save() {
    setBusy(true);
    const done = await onSave({ note, imageData: img.imageData, timeframe: tf, bias });
    setBusy(false);
    if (done) onCancel();
  }

  return html`<div className="form sub" onPaste=${img.onPaste}>
    <h3>${initial ? "Update bewerken" : "➕ Nieuwe update"}</h3>
    <div className="row">
      <div className="field"><label>Timeframe van deze chart</label><${TfPicker} value=${tf} onChange=${setTf} /></div>
      <div className="field"><label>Bias</label><${BiasPicker} value=${bias} onChange=${setBias} allowSame /></div>
    </div>
    <div className="field" style=${{ marginBottom: 12 }}>
      <label>Notitie</label>
      <${NoteEditor} value=${note} onChange=${setNote} placeholder="Wat zie je op deze chart?" />
    </div>
    <div style=${{ marginBottom: 12 }}>
      <${ImageDrop} value=${img.imageData} onChange=${img.setImageData} onFile=${img.takeFile} />
    </div>
    <div className="form-actions">
      <button className="btn primary" disabled=${!ok || busy} onClick=${save}>${busy ? "Opslaan..." : initial ? "Wijziging opslaan" : "Update toevoegen"}</button>
      <button className="btn ghost" onClick=${onCancel}>Annuleer</button>
      ${!tf && html`<span className="hint">Kies een timeframe</span>`}
    </div>
  </div>`;
}

// ─── Move to folder ───────────────────────────────────────────────────────────
function MoveMenu({ entry, allFolders, onMove, onClose }) {
  const [newFolder, setNewFolder] = useState("");
  const current = entry.folder || "Active";
  const options = [...new Set(["Active", "Archief", ...allFolders])];
  const icon = f => f === "Archief" ? "🗄️ " : f === "Active" ? "📌 " : "📁 ";
  return html`<div className="move">
    <div className="hint">Verplaats naar map</div>
    <div style=${{ display: "flex", gap: 6, flexWrap: "wrap" }}>
      ${options.map(f => html`<button key=${f} className=${"chip" + (current === f ? " on" : "")}
        onClick=${() => { onMove(entry, f); onClose(); }}>${icon(f) + f}</button>`)}
    </div>
    <div style=${{ display: "flex", gap: 6 }}>
      <input className="inp" value=${newFolder} onChange=${e => setNewFolder(e.target.value)} placeholder="Nieuwe map..." style=${{ width: 170 }} />
      <button className="btn primary" style=${{ padding: "5px 12px", fontSize: 12 }}
        onClick=${() => { if (newFolder.trim()) { onMove(entry, newFolder.trim()); onClose(); } }}>Aanmaken</button>
    </div>
  </div>`;
}

function Level({ label, value, color, sub }) {

    ${sub && html`<div className="lv-sub">${sub}</div>`}

}

function EntryCard({ entry: e, defaultOpen, editForm, allFolders, onDelete, onEdit, onMove, onSaveUpdate, onDeleteUpdate, openImage }) {
  const [expanded, setExpanded] = useState(!!defaultOpen);
  const cardRef = useRef();
  useEffect(() => {
    if (editForm) { setExpanded(true); setTimeout(() => cardRef.current?.scrollIntoView({ behavior: "smooth", block: "start" }), 50); }
  }, [!!editForm]);
  const [adding, setAdding] = useState(false);
  const [editingIdx, setEditingIdx] = useState(null);
  const [showMove, setShowMove] = useState(false);
  const [tlFilter, setTlFilter] = useState("all");
  const [quote, setQuote] = useState(undefined);

  const cur = e.currency || "USD";
  const folder = e.folder || "Active";
  const items = timelineOf(e);
  const tfs = tfsOf(e);
  const bias = currentBias(e);
  const updates = e.updates ?? [];
  const latestTf = items.find(i => i.tf)?.tf || normTf(e.timeframe) || "1D";

  useEffect(() => {
    if (expanded && e.ticker) fetchQuote(e).then(setQuote);
  }, [expanded, e.ticker, e.exchange]);
  const livePrice = quote?.price ?? null;
  const qCur = quote?.currency || cur;

  const entryPrice = parseFloat(e.price), targetPrice = parseFloat(e.target);
  const pnlN = pnlNum(e, livePrice);
  const pnl = pnlN === null ? null : pnlN.toFixed(2);
  const toTarget = livePrice && targetPrice ? pct(livePrice, targetPrice) : null;
  const pnlColor = pnl === null ? "#94a3b8" : parseFloat(pnl) >= 0 ? "#22c55e" : "#ef4444";
  const loading = quote === undefined ? "laden..." : "—";
  const noQuoteHint = quote === null ? (QUOTE_PROXY ? `Geen koers voor ${yahooSymbol(e)}. Klopt de beurs?` : "Buitenlandse koersen vereisen de koers-worker") : null;

  const shown = tlFilter === "all" ? items : items.filter(i => i.tf === tlFilter);
  const bytes = expanded ? docBytes(e) : 0;
  const usage = Math.round(bytes / DOC_LIMIT * 100);

  return html`<div ref=${cardRef} className=${"card" + (expanded ? " open" : "")} style=${{ scrollMarginTop: 70 }}>
    <div className="card-head" role="button" tabIndex="0" aria-expanded=${expanded}
      onClick=${() => setExpanded(v => !v)}
      onKeyDown=${ev => { if (ev.key === "Enter") setExpanded(v => !v); }}>
      <span className="ticker">${e.ticker}</span>
      ${!URL_TICKER && html`<${TabLink} ticker=${e.ticker} />`}
      <span className="date" title="Laatste activiteit">${formatDate(lastActivity(e))}</span>
      <${BiasBadge} label=${bias} />
      <span className="tfs">${tfs.map(t => html`<${TfBadge} key=${t} tf=${t} />`)}</span>
      ${updates.length > 0 && html`<span className="pill" style=${{ color: "#7dd3fc", background: "#1e3a5f" }}>${updates.length} update${updates.length > 1 ? "s" : ""}</span>`}
      ${folder !== "Active" && html`<span className="pill" style=${{ color: "#f59e0b", background: "#3b2a0a" }}>${folder === "Archief" ? "🗄️" : "📁"} ${folder}</span>`}
      <span className="head-right">
        <span className="levels-mini">
          ${e.price && money(e.price, cur)}
          ${e.price && e.target && " → "}
          ${e.target && html`<span style=${{ color: "#22c55e", fontWeight: 600 }}>🎯 ${money(e.target, cur)}</span>`}
        </span>
        <span className="chev">${expanded ? "▲" : "▼"}</span>
      </span>
    </div>

    ${expanded && html`<div className="body">
      ${editForm && html`<div style=${{ marginTop: 14 }}>${editForm}</div>`}
      <div className="levels">
        <${Level} label=${`Live koers · ${yahooSymbol(e)}`} value=${livePrice ? money(livePrice, qCur) : loading} sub=${noQuoteHint} />
        ${e.price && html`<${Level} label="P&L" value=${signed(pnl)} color=${pnlColor} />`}
        ${e.target && html`<${Level} label="% naar target" value=${signed(toTarget ?? (entryPrice && targetPrice ? pct(entryPrice, targetPrice) : null))} color="#7dd3fc" />`}
        ${e.price && html`<${Level} label="Instap" value=${money(e.price, cur)} />`}
        ${e.target && html`<${Level} label="Target" value=${money(e.target, cur)} color="#22c55e" />`}
        ${e.invalidation && html`<${Level} label="Invalidation" value=${money(e.invalidation, cur)} color="#f97316" sub=${`Ongeldig ${e.invalidationDir || "onder"} dit niveau`} />`}
        <${Level} label="52W high" value=${quote?.high52 ? money(quote.high52, qCur) : loading} color="#22c55e" />
        <${Level} label="52W low" value=${quote?.low52 ? money(quote.low52, qCur) : loading} color="#ef4444" />
      </div>

      ${e.setups?.length > 0 && html`<div className="tags">${e.setups.map(s => html`<span key=${s} className="tag">${s}</span>`)}</div>`}

      <div className="tl-bar">
        <span className="tl-title">Tijdlijn</span>
        <button className=${"chip" + (tlFilter === "all" ? " on" : "")} onClick=${() => setTlFilter("all")}>Alle (${items.length})</button>
        ${tfs.map(t => {
          const info = tfInfo(t);
          const n = items.filter(i => i.tf === t).length;
          return html`<button key=${t} className=${"chip" + (tlFilter === t ? " on" : "")} style=${{ "--c": info.color }}
            onClick=${() => setTlFilter(t)}>${info.label} (${n})</button>`;
        })}
        <span style=${{ marginLeft: "auto" }}>
          ${!adding && html`<button className="btn" onClick=${() => { setAdding(true); setEditingIdx(null); }}>➕ Update toevoegen</button>`}
        </span>
      </div>

      ${adding && html`<${UpdateForm} defaultTf=${latestTf}
        onSave=${u => onSaveUpdate(e, null, u)} onCancel=${() => setAdding(false)} />`}

      ${shown.map(it => {
        const info = tfInfo(it.tf);
        if (it.kind === "update" && editingIdx === it.idx) {
          return html`<${UpdateForm} key=${"edit" + it.idx} initial=${updates[it.idx]} defaultTf=${latestTf}
            onSave=${u => onSaveUpdate(e, it.idx, u)} onCancel=${() => setEditingIdx(null)} />`;
        }
        return html`<div key=${it.kind + it.idx} className="tl-item" style=${{ "--c": info?.color || "#334155" }}>
          <div className="tl-head">
            <${TfBadge} tf=${it.tf} big />
            <span className="tl-date">${formatDateTime(it.date)}</span>
            <${BiasBadge} label=${it.bias} />
            ${it.kind === "main" && html`<span className="tl-kind">Startanalyse</span>`}
            ${it.kind === "update" && html`<span className="tl-actions">
              <button className="btn small" onClick=${() => { setEditingIdx(it.idx); setAdding(false); }}>Bewerk</button>
              <button className="btn small danger" onClick=${() => onDeleteUpdate(e, it.idx)}>Verwijder</button>
            </span>`}
          </div>
          ${it.note && html`<${RichNote} text=${it.note} />`}
          ${it.imageData && html`<img className="shot" src=${it.imageData} alt=${`${e.ticker} ${info?.label || ""} chart`} onClick=${() => openImage(it.imageData)} />`}
        </div>`;
      })}

      <div className="actions">
        <button className="btn" onClick=${() => onEdit(e)}>Startanalyse bewerken</button>
        <button className="btn warn" onClick=${() => setShowMove(v => !v)}>📁 Verplaats</button>
        <button className="btn danger" onClick=${() => onDelete(e)}>Verwijder entry</button>
        <span className=${"usage" + (usage >= 80 ? " high" : "")} title="Firestore laat max ~1 MB per entry toe">Opslag ${usage}%</span>
      </div>
      ${showMove && html`<${MoveMenu} entry=${e} allFolders=${allFolders} onMove=${onMove} onClose=${() => setShowMove(false)} />`}
    </div>`}
  </div>`;
}

async function mapLimit(items, n, fn) {
  const out = []; let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => {
    while (i < items.length) { const k = i++; out[k] = await fn(items[k]); }
  }));
  return out;
}
const fmtPct = v => v === null || v === undefined ? "—" : `${v >= 0 ? "+" : ""}${v.toFixed(1)}%`;

function Spark({ closes, n = 63 }) {
  if (!closes || closes.length < 2) return html`<span className="hint">—</span>`;

  const pts = arr => arr.map((v, i) => v === null ? null : `${(i / (arr.length - 1) * W).toFixed(1)},${(H - 2 - (v - lo) / span * (H - 4)).toFixed(1)}`).filter(Boolean).join(" ");
  const up = c[c.length - 1] >= c[0];

// RRG (Relative Rotation Graph) — benadering van JdK RS-Ratio / RS-Momentum op weekbasis
const RRG_PALETTE = ["#60a5fa", "#c084fc", "#f472b6", "#a3e635", "#fb923c", "#38bdf8", "#34d399", "#facc15", "#f87171", "#e879f9",
  "#2dd4bf", "#fda4af", "#93c5fd", "#fcd34d", "#86efac", "#d8b4fe", "#fdba74", "#67e8f9", "#bef264"];
const RRG_COLORS = { XLK: "#60a5fa", XLC: "#c084fc", XLY: "#f472b6", XLP: "#a3e635", XLE: "#fb923c", XLF: "#38bdf8",
  XLV: "#34d399", XLI: "#facc15", XLB: "#f87171", XLRE: "#e879f9", XLU: "#2dd4bf" };
const smaAt = (a, i, n) => { if (i < n - 1) return null; let s = 0; for (let k = i - n + 1; k <= i; k++) s += a[k]; return s / n; };
const sdAt = (a, i, n, m) => { let s = 0; for (let k = i - n + 1; k <= i; k++) s += (a[k] - m) ** 2; return Math.sqrt(s / n); };
function emaArr(a, n) { const k = 2 / (n + 1); let e = null; return a.map(v => v === null ? null : (e = e === null ? v : v * k + e * (1 - k))); }
function rrgSeries(closes, bench, tail = 8) {
  const len = Math.min(closes.length, bench.length);
  if (len < 5 * 40) return null;
  const c = closes.slice(-len), b = bench.slice(-len);
  const rs = [];                                                   // weekslot: elke 5e handelsdag vanaf vandaag terug
  for (let i = len - 1; i >= 0; i -= 5) rs.unshift(c[i] / b[i]);
  const rsS = emaArr(rs, 2);
  const sdOf = a => { const v = a.slice(-52), m = v.reduce((x, y) => x + y, 0) / v.length; return Math.sqrt(v.reduce((x, y) => x + (y - m) ** 2, 0) / v.length) || 1; };
  // RS-Ratio: % boven/onder het eigen 10-weeks gemiddelde, genormaliseerd op de beweeglijkheid van het laatste jaar
  const dev = rsS.map((v, i) => { const m = smaAt(rsS, i, 10); return m === null ? null : (v / m - 1) * 100; }).filter(v => v !== null);
  const sdD = sdOf(dev);
  const rr = emaArr(dev.map(v => 100 + v / sdD), 2);
  // RS-Momentum: verandering van de RS-Ratio t.o.v. zijn 4-weeks gemiddelde, op dezelfde manier genormaliseerd
  const mom = rr.map((v, i) => { const m = smaAt(rr, i, 4); return m === null ? null : v - m; });
  const momV = mom.filter(v => v !== null), sdM = sdOf(momV);
  const pts = rr.map((x, i) => mom[i] === null ? null : { x, y: 100 + mom[i] / sdM }).filter(Boolean);
  return pts.length ? pts.slice(-tail) : null;
}
const quadrant = p => p.x >= 100 ? (p.y >= 100 ? "Leading" : "Weakening") : (p.y >= 100 ? "Improving" : "Lagging");
const QUAD_COLOR = { Leading: "#22c55e", Weakening: "#f59e0b", Lagging: "#ef4444", Improving: "#38bdf8" };

function RRG({ series, benchName = "SPY", labels = {} }) {
  const [hover, setHover] = useState(null);
  const items = Object.entries(series).filter(([, pts]) => pts);
  if (!items.length) return null;
  const W = 760, H = 520, P = 44;
  const all = items.flatMap(([, pts]) => pts);
  const span = Math.max(1.5, ...all.map(p => Math.max(Math.abs(p.x - 100), Math.abs(p.y - 100)))) * 1.12;
  const sx = x => P + (x - (100 - span)) / (2 * span) * (W - 2 * P);
  const sy = y => H - P - (y - (100 - span)) / (2 * span) * (H - 2 * P);
  const cx = sx(100), cy = sy(100);
  const q = [
    { n: "Improving", x: P, y: P, w: cx - P, h: cy - P, tx: P + 10, ty: P + 20, a: "start" },
    { n: "Leading", x: cx, y: P, w: W - P - cx, h: cy - P, tx: W - P - 10, ty: P + 20, a: "end" },
    { n: "Weakening", x: cx, y: cy, w: W - P - cx, h: H - P - cy, tx: W - P - 10, ty: H - P - 10, a: "end" },
    { n: "Lagging", x: P, y: cy, w: cx - P, h: H - P - cy, tx: P + 10, ty: H - P - 10, a: "start" },
  ];
  const ticks = [-1, -0.5, 0.5, 1].map(f => 100 + f * span * 0.85).map(v => Math.round(v * 2) / 2).filter((v, i, a) => v !== 100 && a.indexOf(v) === i);
  return html`<div style=${{ marginTop: 22 }}>
    <div className="ov-sum" style=${{ marginBottom: 6 }}>
      <span><b>Relative Rotation Graph</b> · sectoren tegenover ${benchName} · staart = laatste 8 weken</span>
    </div>
    <div className="ov-wrap" style=${{ padding: 10 }}>
      <svg viewBox=${`0 0 ${W} ${H}`} style=${{ width: "100%", maxWidth: 900, display: "block", margin: "0 auto" }} role="img" aria-label="Relative Rotation Graph van de sector-ETF's">
        ${q.map(r => html`<g key=${r.n}>
          <rect x=${r.x} y=${r.y} width=${r.w} height=${r.h} fill=${QUAD_COLOR[r.n]} fillOpacity="0.07" />
          <text x=${r.tx} y=${r.ty} textAnchor=${r.a} fill=${QUAD_COLOR[r.n]} fontSize="13" fontWeight="700" opacity="0.85">${r.n}</text>
        </g>`)}
        <line x1=${cx} y1=${P} x2=${cx} y2=${H - P} stroke="#475569" strokeWidth="1" />
        <line x1=${P} y1=${cy} x2=${W - P} y2=${cy} stroke="#475569" strokeWidth="1" />
        <rect x=${P} y=${P} width=${W - 2 * P} height=${H - 2 * P} fill="none" stroke="#1e293b" />
        ${ticks.map(v => html`<g key=${"t" + v}>
          <text x=${sx(v)} y=${H - P + 16} textAnchor="middle" fill="#64748b" fontSize="11">${v.toFixed(1)}</text>
          <text x=${P - 6} y=${sy(v) + 4} textAnchor="end" fill="#64748b" fontSize="11">${v.toFixed(1)}</text>
        </g>`)}
        <text x=${W / 2} y=${H - 8} textAnchor="middle" fill="#94a3b8" fontSize="12">RS-Ratio → (relatieve sterkte vs ${benchName})</text>
        <text x=${P} y=${P - 12} fill="#94a3b8" fontSize="12">↑ RS-Momentum (versnelt de relatieve sterkte?)</text>
        ${items.map(([t, pts], idx) => {
          const col = RRG_COLORS[t] || RRG_PALETTE[idx % RRG_PALETTE.length], last = pts[pts.length - 1];
          const dim = hover && hover !== t;
          return html`<g key=${t} opacity=${dim ? 0.15 : 1} style=${{ cursor: "pointer" }}
            onMouseEnter=${() => setHover(t)} onMouseLeave=${() => setHover(null)}>
            <polyline points=${pts.map(p => `${sx(p.x)},${sy(p.y)}`).join(" ")} fill="none" stroke=${col} strokeWidth=${hover === t ? 2.5 : 1.6} strokeOpacity="0.85" />
            ${pts.slice(0, -1).map((p, i) => html`<circle key=${i} cx=${sx(p.x)} cy=${sy(p.y)} r="2.4" fill=${col} opacity=${0.35 + 0.5 * i / pts.length} />`)}
            <circle cx=${sx(last.x)} cy=${sy(last.y)} r="6" fill=${col} stroke="#020617" strokeWidth="1.5" />
            <text x=${sx(last.x) + 9} y=${sy(last.y) + 4} fill=${col} fontSize="12" fontWeight="700" fontFamily=${labels[t] ? "inherit" : "monospace"}>${labels[t] || t}</text>
            <title>${labels[t] ? labels[t] + " (" + t + ")" : t}: ${quadrant(last)} · RS-Ratio ${last.x.toFixed(2)} · RS-Momentum ${last.y.toFixed(2)}</title>
          </g>`;
        })}
      </svg>
      <p className="hint" style=${{ margin: "6px 4px 0" }}>Sectoren roteren meestal met de klok mee: Improving → Leading → Weakening → Lagging. Grote stip = deze week, de staart toont de vorige 7 weken. Ga met de muis over een sector om die te markeren. Berekend op weekslotkoersen als benadering van de JdK-methode; de exacte waarden kunnen licht afwijken van StockCharts.</p>
    </div>
  </div>`;
}

function Sectors({ entries, onOpen, set: cfgKey = "us" }) {
  const cfg = SECTOR_SETS[cfgKey];
  const [hist, setHist] = useState({});
  const [stamp, setStamp] = useState(null);
  const [busy, setBusy] = useState(false);
  const [sort, setSort] = useState({ key: "m1", dir: -1 });

  async function load(force) {
    setBusy(true);
    const list = [...cfg.benches, ...cfg.sectors];
    if (force) list.forEach(x => delete histCache[cfg.exchange + ":" + x.t]);
    const res = await mapLimit(list, 4, x => fetchHistory({ ticker: x.t, exchange: cfg.exchange }));
    const m = {}; list.forEach((x, i) => { m[x.t] = res[i]; });
    setHist(m); setStamp(new Date()); setBusy(false);
  }
  useEffect(() => { setHist({}); load(false); }, [cfgKey]);

  const build = x => {
    const h = hist[x.t];
    const c = h?.status === "ok" ? h.closes : null;
    const r = { ...x, h, c, live: c ? (h.price ?? c[c.length - 1]) : null, trend: c ? emaTrend(c) : null };
    PERIODS.forEach(p => { r[p.k] = c ? perfN(c, p.n) : null; });
    r.hi = c ? (r.live / Math.max(...c.slice(-252)) - 1) * 100 : null;
    r.inJournal = entries.find(e => (e.exchange || "US") === cfg.exchange && e.ticker.trim().toUpperCase() === x.t);
    return r;
  };
  const benches = cfg.benches.map(build);
  const bench = benches[0];                                         // maatstaf voor RS en RRG
  const rsOf = r => r.m3 !== null && bench.m3 !== null ? r.m3 - bench.m3 : null;
  const rows = cfg.sectors.map(build).map(r => ({ ...r, rs: rsOf(r) }));
  benches.forEach((b, i) => { b.rs = i === 0 ? (bench.m3 !== null ? 0 : null) : rsOf(b); b.isBench = true; b.isMain = i === 0; });
  const table = [...benches, ...rows];                              // maatstaven sorteren mee als scheidingslijn
  const val = r => sort.key === "ticker" ? r.t : sort.key === "trend" ? (r.trend ? (r.trend.bull ? 1 : 0) : -1) : (r[sort.key] ?? -1e9);
  table.sort((a, b) => { const x = val(a), y = val(b); return ((x < y ? -1 : x > y ? 1 : 0) * sort.dir) || (a.isMain ? -1 : b.isMain ? 1 : 0); });
  const sortBy = (key, dir) => setSort(s => s.key === key ? { key, dir: -s.dir } : { key, dir });
  const Th = ({ k, d, r, children }) => html`<th className=${"sort" + (sort.key === k ? " on" : "") + (r ? " r" : "")} onClick=${() => sortBy(k, d)}>
    ${children}${sort.key === k ? (sort.dir === 1 ? " ▲" : " ▼") : ""}</th>`;

  const ranked = rows.filter(r => r.w1 !== null).sort((a, b) => b.w1 - a.w1);
  const rrg = {};
  if (bench.c) rows.forEach(r => { rrg[r.t] = r.c ? rrgSeries(r.c, bench.c) : null; });
  const nBull = rows.filter(r => r.trend?.bull).length, nBear = rows.filter(r => r.trend && !r.trend.bull).length;
  const oldWorker = [...benches, ...rows].some(r => r.h?.status === "oldworker");
  const scale = { d1: 2, w1: 4, m1: 8, m3: 12, y1: 25 };

  const row = (r, isBench) => html`<tr key=${r.t} className=${isBench ? "bench" : ""} title=${isBench ? `Maatstaf: sectoren boven deze rij doen het beter dan de ${r.n}` : undefined}>
    <td>
      <a className="ticker" style=${{ minWidth: 0, textDecoration: "none", color: "#f8fafc" }} href=${tvUrl(r.t, cfg.tv)} target="_blank" rel="noopener" title="Openen in TradingView">${r.t}</a>
      ${r.inJournal && html` <button className="btn small" title="Openen in je journal" onClick=${() => onOpen(r.inJournal)}>📓</button>`}
      <span className="sec-name">${r.n}</span>
    </td>
    <td><${Spark} closes=${r.c} /></td>
    <td className="num">${r.live ? money(r.live, cfg.currency) : r.h ? "—" : "…"}</td>
    ${PERIODS.map(p => html`<td key=${p.k} className="heat" style=${heatStyle(r[p.k], scale[p.k])}>${r.h ? fmtPct(r[p.k]) : "…"}</td>`)}
    <td className="heat" style=${r.isMain ? { color: "#64748b" } : heatStyle(r.rs, 6)}>${r.isMain ? "—" : r.h ? fmtPct(r.rs) : "…"}</td>
    <td className="num" style=${{ textAlign: "right", color: r.hi !== null && r.hi > -3 ? "#4ade80" : "#cbd5e1" }}>${r.h ? fmtPct(r.hi) : "…"}</td>
    <td>${r.trend ? html`<${BiasBadge} label=${r.trend.bull ? "Bullish" : "Bearish"} />` : r.h ? html`<span className="hint">geen data</span>` : "…"}
      ${r.trend?.bars != null && html`<span className="sub">${r.trend.bars} ${r.trend.bars === 1 ? "dag" : "dagen"}</span>`}</td>
  </tr>`;

  return html`<div>
    ${oldWorker && html`<div className="error"><span>⚠️ Je koers-worker geeft nog geen dagkoersen terug. Vervang de code van de worker in Cloudflare door <b>koers-worker.js</b> uit de repo.</span></div>`}
    <div className="ov-sum">
      <span>${cfg.label}</span>
      <span style=${{ color: BIAS_COLOR.Bullish }}>${nBull} bullish</span>
      <span style=${{ color: BIAS_COLOR.Bearish }}>${nBear} bearish</span>
      ${ranked.length > 0 && html`<span>Sterkst deze week: <b style=${{ color: "#4ade80" }}>${ranked[0].t}</b>${ranked[0].s ? ` (${ranked[0].s})` : ""} · zwakst: <b style=${{ color: "#f87171" }}>${ranked[ranked.length - 1].t}</b>${ranked[ranked.length - 1].s ? ` (${ranked[ranked.length - 1].s})` : ""}</span>`}
      <span style=${{ marginLeft: "auto" }}>${busy ? "Dagkoersen laden..." : stamp ? `Data van ${stamp.toLocaleTimeString("nl-BE", { hour: "2-digit", minute: "2-digit" })}` : ""}</span>
      <button className="btn small" disabled=${busy} onClick=${() => load(true)}>↻ Vernieuw</button>
    </div>
    <div className="ov-wrap">
      <table className="ov" style=${{ minWidth: 900 }}>
        <thead><tr>
          <${Th} k="ticker" d=${1}>Sector<//>
          <th>3 maanden <span style=${{ color: "#fbbf24" }}>— EMA15</span> <span>┄ EMA50</span></th>
          <th>Koers</th>
          ${PERIODS.map(p => html`<${Th} key=${p.k} k=${p.k} d=${-1} r=${true}>${p.label}<//>`)}
          <${Th} k="rs" d=${-1} r=${true}>vs ${cfg.benchShort} (3M)<//>
          <${Th} k="hi" d=${-1} r=${true}>van 52W top<//>
          <${Th} k="trend" d=${-1}>Trend (D)<//>
        </tr></thead>
        <tbody>
          ${table.map(r => row(r, !!r.isBench))}
        </tbody>
      </table>
    </div>
    <p className="hint" style=${{ marginTop: 8 }}>Rendement op basis van slotkoersen (1W = 5, 1M = 21, 3M = 63 handelsdagen). Trend = EMA 15 boven EMA 50 op de daggrafiek. Klik op een ticker om de chart in TradingView te openen.</p>
    <${RRG} key=${cfgKey} series=${rrg} benchName=${cfg.benchShort} labels=${Object.fromEntries(cfg.sectors.filter(x => x.s).map(x => [x.t, x.s]))} />
  </div>`;
}

// ─── Main app ─────────────────────────────────────────────────────────────────
function App() {
  const [entries, setEntries] = useState([]);
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [showForm, setShowForm] = useState(false);
  const [editEntry, setEditEntry] = useState(null);
  const [search, setSearch] = useState("");
  const [filterBias, setFilterBias] = useState("All");
  const [filterSetup, setFilterSetup] = useState("All");
  const [filterTf, setFilterTf] = useState("All");
  const [filterFolder, setFilterFolder] = useState(URL_TICKER ? "Alle" : "Active");
  const [groupByTicker, setGroupByTicker] = useState(true);
  // Startpagina = Posities; in een ticker-tabblad meteen de kaarten
  const [view, setView] = useState(URL_TICKER ? "kaarten" : "posities");
  const [lightbox, setLightbox] = useState(null);
  const [error, setError] = useState("");

  useEffect(() => { if (URL_TICKER) document.title = `${URL_TICKER} · Trade Journal`; }, []);
  useEffect(() => { initFirebase().then(loadEntries).catch(e => { setError(e.message); setLoading(false); }); }, []);
  useEffect(() => {
    const onKey = e => { if (e.key === "Escape") setLightbox(null); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  async function loadEntries() {
    try {
      const { collection, getDocs, query, orderBy } = fbFn;
      const snap = await getDocs(query(collection(db, "trade_journal"), orderBy("date", "desc")));
      setEntries(snap.docs.map(d => ({ id: d.id, ...d.data() })));
    } catch (e) { setError(e.message); } finally { setLoading(false); }
  }

  async function handleSave(form) {
    setSaving(true); setError("");
    try {
      const payload = {
        ticker: form.ticker.trim().toUpperCase(), date: form.date,
        exchange: form.exchange || "US", price: form.price || "", target: form.target || "", currency: form.currency || "USD",
        bias: form.bias, timeframe: form.timeframe, setups: form.setups,
        note: form.note, imageData: form.imageData || "",
        invalidation: form.invalidation || "", invalidationDir: form.invalidationDir || "onder",
        updates: form.updates || [],
        updatedAt: new Date().toISOString(),
      };
      if (editEntry) {
        checkSize({ ...editEntry, ...payload });
        await fbFn.updateDoc(fbFn.doc(db, "trade_journal", editEntry.id), payload);
        setEntries(es => es.map(e => e.id === editEntry.id ? { ...e, ...payload } : e));
      } else {
        payload.createdAt = new Date().toISOString();
        checkSize(payload);
        const ref = await fbFn.addDoc(fbFn.collection(db, "trade_journal"), payload);
        setEntries(es => [{ id: ref.id, ...payload }, ...es]);
      }
      setShowForm(false); setEditEntry(null);
    } catch (e) { setError(e.message); } finally { setSaving(false); }
  }

  async function handleDelete(entry) {
    if (!confirm(`Verwijder ${entry.ticker} (${formatDate(entry.date)}) met alle updates?`)) return;
    try {
      await fbFn.deleteDoc(fbFn.doc(db, "trade_journal", entry.id));
      setEntries(es => es.filter(e => e.id !== entry.id));
    } catch (e) { setError(e.message); }
  }

  async function handleMove(entry, folder) {
    try {
      await fbFn.updateDoc(fbFn.doc(db, "trade_journal", entry.id), { folder });
      setEntries(es => es.map(e => e.id === entry.id ? { ...e, folder } : e));
    } catch (e) { setError(e.message); }
  }

  async function writeUpdates(entry, updates) {
    checkSize({ ...entry, updates });
    const updatedAt = new Date().toISOString();
    await fbFn.updateDoc(fbFn.doc(db, "trade_journal", entry.id), { updates, updatedAt });
    setEntries(es => es.map(e => e.id === entry.id ? { ...e, updates, updatedAt } : e));
  }

  // idx === null → nieuwe update, anders bestaande bewerken
  async function handleSaveUpdate(entry, idx, upd) {
    setError("");
    try {
      const updates = [...(entry.updates ?? [])];
      const clean = { note: upd.note, imageData: upd.imageData || "", timeframe: upd.timeframe, bias: upd.bias || "" };
      if (idx === null) updates.push({ ...clean, date: new Date().toISOString() });
      else updates[idx] = { ...updates[idx], ...clean, editedAt: new Date().toISOString() };
      await writeUpdates(entry, updates);
      return true;
    } catch (e) { setError(e.message); return false; }
  }

  async function handleDeleteUpdate(entry, idx) {
    if (!confirm("Deze update verwijderen?")) return;
    setError("");
    try { await writeUpdates(entry, (entry.updates ?? []).filter((_, i) => i !== idx)); }
    catch (e) { setError(e.message); }
  }

  function handleEdit(entry) { setEditEntry(entry); setShowForm(false); }

  const allFolders = [...new Set(entries.map(e => e.folder || "Active"))];
  const folderOptions = [...new Set(["Active", "Archief", ...allFolders])];
  const folderIcon = f => f === "Archief" ? "🗄️ " : f === "Active" ? "📌 " : "📁 ";

  const filtered = entries.filter(e => {
    const s = search.trim().toLowerCase();
    const text = [e.ticker, e.note, ...(e.updates ?? []).map(u => u.note)].join(" ").toLowerCase();
    return (!URL_TICKER || e.ticker === URL_TICKER)
      && (!s || text.includes(s))
      && (filterBias === "All" || currentBias(e) === filterBias)
      && (filterSetup === "All" || (e.setups ?? []).includes(filterSetup))
      && (filterTf === "All" || tfsOf(e).includes(filterTf))
      && (filterFolder === "Alle" || (e.folder || "Active") === filterFolder);
  }).sort((a, b) => lastActivity(b).localeCompare(lastActivity(a)));

  const tickers = [...new Set(filtered.map(e => e.ticker))].sort();
  const editForm = editEntry && html`<${EntryForm} key=${editEntry.id} initial=${editEntry} saving=${saving} onSave=${handleSave}
    onCancel=${() => setEditEntry(null)} />`;
  const card = (e, i) => html`<${EntryCard} key=${e.id} entry=${e} defaultOpen=${!!URL_TICKER && i === 0} allFolders=${allFolders}
    editForm=${editEntry?.id === e.id ? editForm : null}
    onDelete=${handleDelete} onEdit=${handleEdit} onMove=${handleMove}
    onSaveUpdate=${handleSaveUpdate} onDeleteUpdate=${handleDeleteUpdate} openImage=${setLightbox} />`;

  return html`<div>
    <div className="header">
      <div>
        <span className="brand">📈 ${URL_TICKER || "Trade Journal"}</span>
        <span className="count">${URL_TICKER ? `${filtered.length} ${filtered.length === 1 ? "entry" : "entries"}` : `${entries.length} analyses`}</span>
        ${URL_TICKER && html`<a className="crumb" href=${location.pathname}>← Alle tickers</a>`}
      </div>
      <button className="btn primary" onClick=${() => { setEditEntry(null); setShowForm(v => !v); }}>
        ${showForm && !editEntry ? "✕ Annuleer" : "+ Nieuwe analyse"}
      </button>
    </div>

    <div className=${"wrap" + (view === "sectoren" || view === "eurosectoren" ? " wide" : "")}>
      ${error && html`<div className="error"><span>⚠️ ${error}</span><button className="btn small ghost" onClick=${() => setError("")}>✕</button></div>`}
      ${showForm && !editEntry && html`<${EntryForm} key="new" defaultTicker=${URL_TICKER} saving=${saving} onSave=${handleSave}
        onCancel=${() => setShowForm(false)} />`}

      <div className="toolbar">
        ${view !== "sectoren" && view !== "eurosectoren" && html`<input className="inp search" value=${search} onChange=${e => setSearch(e.target.value)} placeholder=${URL_TICKER ? "🔍 Zoek in notities..." : "🔍 Zoek ticker of notitie..."} />
        <select className="inp" value=${filterTf} onChange=${e => setFilterTf(e.target.value)}>
          <option value="All">Alle timeframes</option>
          ${TIMEFRAMES.map(t => html`<option key=${t.id} value=${t.id}>${t.label}</option>`)}
        </select>
        <select className="inp" value=${filterBias} onChange=${e => setFilterBias(e.target.value)}>
          <option value="All">Alle biases</option>
          ${BIASES.map(b => html`<option key=${b}>${b}</option>`)}
        </select>
        <select className="inp" value=${filterSetup} onChange=${e => setFilterSetup(e.target.value)}>
          <option value="All">Alle setups</option>
          ${SETUPS.map(s => html`<option key=${s}>${s}</option>`)}
        </select>
        <select className="inp" value=${filterFolder} onChange=${e => setFilterFolder(e.target.value)}>
          ${folderOptions.map(f => html`<option key=${f} value=${f}>${folderIcon(f) + f}</option>`)}
          <option value="Alle">Alle mappen</option>
        </select>`}
        ${view === "kaarten" && html`<button className="btn" onClick=${() => setGroupByTicker(v => !v)}>${groupByTicker ? "Groep: ticker" : "Groep: datum"}</button>`}
        <div className="seg">
          <button className=${view === "posities" ? "on" : ""} onClick=${() => setView("posities")}>Posities</button>
          <button className=${view === "kaarten" ? "on" : ""} onClick=${() => setView("kaarten")}>Kaarten</button>
          <button className=${view === "overzicht" ? "on" : ""} onClick=${() => setView("overzicht")}>Overzicht</button>
          <button className=${view === "sectoren" ? "on" : ""} onClick=${() => setView("sectoren")}>US sectoren</button>
          <button className=${view === "eurosectoren" ? "on" : ""} onClick=${() => setView("eurosectoren")}>Euro sectoren</button>
        </div>
      </div>

      ${view === "sectoren" || view === "eurosectoren" ? html`<${Sectors} key=${view} set=${view === "sectoren" ? "us" : "eu"} entries=${entries} onOpen=${e => { setView("kaarten"); setFilterFolder("Alle"); setSearch(e.ticker); }} />`
        : loading ? html`<div className="empty">Verbinden met Firebase...</div>`
        : filtered.length === 0 ? html`<div className="empty">${entries.length === 0 ? "Nog geen analyses. Klik op + Nieuwe analyse om te beginnen." : "Geen resultaten voor deze filters."}</div>`
        : view === "posities" ? html`<${Positions} entries=${filtered} onOpen=${e => { setView("kaarten"); setSearch(e.ticker); }} />`
        : view === "overzicht" ? html`<${Overview} entries=${filtered} onOpen=${e => { setView("kaarten"); setSearch(e.ticker); }} />`
        : groupByTicker ? tickers.map(t => {
            const group = filtered.filter(e => e.ticker === t);
            return html`<div key=${t}>
              <div className="group-head"><span className="name">${t}</span>${!URL_TICKER && html`<${TabLink} ticker=${t} />`}<span className="rule"></span><span className="n">${group.length} ${group.length === 1 ? "entry" : "entries"}</span></div>
              ${group.map(card)}
            </div>`;
          })
        : filtered.map(card)}
    </div>

    ${lightbox && html`<div className="lightbox" onClick=${() => setLightbox(null)} role="dialog" aria-label="Chart vergroot">
      <img src=${lightbox} alt="Chart" />
    </div>`}
  </div>`;
}

createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
