<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trade Journal</title>
  <style>
    :root {
      --bg: #020617; --panel: #0f172a; --panel2: #0a1628; --line: #1e293b; --line2: #334155;
      --text: #e2e8f0; --muted: #64748b; --dim: #94a3b8; --accent: #7dd3fc; --blue: #1d4ed8;
      --green: #22c55e; --red: #ef4444; --orange: #f97316; --amber: #f59e0b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); font-family: 'Inter', system-ui, sans-serif; color: var(--text); font-size: 14px; }
    button, input, select, textarea { font-family: inherit; font-size: 13px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .inp { background: #1e293b; border: 1px solid var(--line2); color: #f8fafc; border-radius: 6px; padding: 7px 10px; outline: none; }
    .inp:focus { border-color: var(--accent); }
    textarea.inp { width: 100%; resize: vertical; line-height: 1.6; }

    .btn { background: #1e293b; color: var(--accent); border: 1px solid var(--line2); border-radius: 6px; padding: 5px 12px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .btn:hover:not(:disabled) { border-color: currentColor; }
    .btn.primary { background: var(--blue); color: #fff; border-color: var(--blue); padding: 7px 18px; font-size: 13px; }
    .btn.danger { color: #f87171; }
    .btn.warn { color: var(--amber); }
    .btn.ghost { color: var(--dim); }
    .btn.small { padding: 2px 8px; font-size: 11px; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }

    .header { position: sticky; top: 0; z-index: 100; background: var(--bg); border-bottom: 1px solid var(--line); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .brand { font-family: monospace; font-size: 17px; font-weight: 800; color: var(--accent); letter-spacing: 1px; }
    .count { font-size: 12px; color: var(--dim); background: var(--line); padding: 2px 8px; border-radius: 10px; margin-left: 10px; }
    .wrap { max-width: 920px; margin: 0 auto; padding: 20px 16px 60px; }

    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
    .toolbar .search { flex: 1 1 200px; }

    .error { background: #450a0a; border: 1px solid #f87171; border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; color: #fca5a5; font-size: 13px; display: flex; justify-content: space-between; gap: 10px; }
    .empty { color: var(--muted); text-align: center; padding: 60px 0; line-height: 2; }

    .group-head { display: flex; align-items: center; gap: 10px; margin: 26px 0 10px; }
    .group-head:first-child { margin-top: 0; }
    .group-head .name { font-family: monospace; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 1px; }
    .group-head .rule { flex: 1; height: 1px; background: var(--line); }
    .group-head .n { font-size: 11px; color: var(--muted); }

    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
    .card.open { border-color: var(--line2); }
    .card-head { display: flex; align-items: center; gap: 10px; padding: 11px 16px; cursor: pointer; flex-wrap: wrap; }
    .card-head:hover { background: #111c33; }
    .ticker { font-family: monospace; font-weight: 700; font-size: 15px; color: #f8fafc; min-width: 64px; }
    .date { font-size: 12px; color: var(--muted); }
    .tfs { display: inline-flex; gap: 4px; }
    .pill { font-size: 10px; padding: 1px 7px; border-radius: 10px; }
    .head-right { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); }
    .chev { color: #475569; font-size: 11px; }

    .tf { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 20px; padding: 0 6px; border-radius: 4px; font-size: 11px; font-weight: 700; border: 1px solid; }
    .tf.big { height: 24px; padding: 0 10px; font-size: 12px; }
    .bias { color: #fff; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; letter-spacing: .5px; }
    .tag { background: #1e293b; color: var(--accent); font-size: 11px; padding: 2px 8px; border-radius: 4px; border: 1px solid var(--line2); }

    .body { padding: 0 16px 16px; border-top: 1px solid var(--line); }
    .levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 12px 16px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; margin-top: 14px; }
    .lv-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
    .lv-val { font-family: monospace; font-size: 16px; font-weight: 700; color: #f8fafc; }
    .lv-sub { font-size: 10px; color: var(--orange); }
    .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }

    .tl-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 18px 0 12px; }
    .tl-title { font-size: 12px; color: var(--dim); font-weight: 600; margin-right: 4px; }
    .chip { background: #1e293b; color: var(--dim); border: 1px solid var(--line2); border-radius: 14px; padding: 3px 11px; font-size: 11px; font-weight: 600; cursor: pointer; }
    .chip.on { color: #0b1020; background: var(--c, var(--accent)); border-color: var(--c, var(--accent)); }

    .tl-item { border-left: 3px solid var(--c, var(--line2)); padding: 2px 0 2px 14px; margin-bottom: 20px; }
    .tl-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
    .tl-date { font-size: 11px; color: var(--muted); }
    .tl-kind { font-size: 10px; color: var(--amber); border: 1px solid #f59e0b55; border-radius: 10px; padding: 0 7px; }
    .tl-actions { margin-left: auto; display: flex; gap: 6px; }
    .note { white-space: pre-wrap; color: #cbd5e1; font-size: 13px; line-height: 1.65; }
    .shot { width: 100%; border-radius: 6px; margin-top: 8px; border: 1px solid var(--line); cursor: zoom-in; display: block; }

    .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
    .usage { margin-left: auto; font-size: 11px; color: var(--muted); }
    .usage.high { color: var(--amber); }

    .form { background: var(--panel); border: 1px solid var(--line2); border-radius: 12px; padding: 20px; margin-bottom: 22px; }
    .form.sub { background: #0f1f35; border-color: #1e3a5f; border-radius: 8px; padding: 16px; margin-top: 12px; }
    .form h3 { font-size: 15px; font-weight: 700; margin-bottom: 18px; color: #f8fafc; }
    .form.sub h3 { font-size: 13px; color: var(--accent); margin-bottom: 12px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; align-items: flex-end; }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field > label { font-size: 11px; color: var(--muted); font-weight: 600; }
    .hint { font-size: 11px; color: var(--muted); }
    .form-actions { display: flex; gap: 10px; align-items: center; }

    .seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 6px; overflow: hidden; flex-wrap: wrap; }
    .seg button { background: #1e293b; color: var(--dim); border: 0; border-right: 1px solid var(--line2); padding: 6px 11px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .seg button:last-child { border-right: 0; }
    .seg button.on { background: var(--c, var(--accent)); color: #0b1020; }

    .drop { border: 1px dashed var(--line2); border-radius: 8px; padding: 14px; text-align: center; color: var(--dim); font-size: 12px; cursor: pointer; }
    .drop:hover, .drop.over { border-color: var(--accent); color: var(--accent); }
    .drop.has { border-style: solid; border-color: #22c55e88; color: var(--green); }
    .thumb-row { display: flex; align-items: flex-start; gap: 10px; margin-top: 10px; }
    .thumb { max-height: 180px; max-width: 100%; border-radius: 6px; border: 1px solid var(--line); }

    .move { background: var(--panel2); border: 1px solid var(--line2); border-radius: 8px; padding: 12px; margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }

    .tablink { color: var(--dim); text-decoration: none; font-size: 12px; border: 1px solid var(--line2); border-radius: 5px; padding: 1px 7px; }
    .tablink:hover { color: var(--accent); border-color: var(--accent); }
    .crumb { color: var(--dim); text-decoration: none; font-size: 12px; margin-left: 12px; }
    .crumb:hover { color: var(--accent); }
    .lightbox { position: fixed; inset: 0; background: rgba(2, 6, 23, .94); display: flex; align-items: center; justify-content: center; z-index: 300; padding: 16px; cursor: zoom-out; }
    .lightbox img { max-width: 100%; max-height: 100%; border-radius: 6px; }

    @media (max-width: 600px) {
      .header { padding: 10px 12px; }
      .head-right .levels-mini { display: none; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="module">
import React, { useState, useEffect, useRef } from "https://esm.sh/react@18";
import { createRoot } from "https://esm.sh/react-dom@18/client";
import htm from "https://esm.sh/htm@3";
const html = htm.bind(React.createElement);

// ─── Firebase ─────────────────────────────────────────────────────────────────
let db, fbFn;
async function initFirebase() {
  if (db) return;
  const { initializeApp, getApps } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");
  const { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, query, orderBy } =
    await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
  const config = {
    apiKey: "AIzaSyBTCiLlyhz79vDB4AaROQgDwxNrjI7fmLM",
    authDomain: "investment-journal-ac26f.firebaseapp.com",
    projectId: "investment-journal-ac26f",
    storageBucket: "investment-journal-ac26f.firebasestorage.app",
    messagingSenderId: "688873767307",
    appId: "1:688873767307:web:bb95b34f7210056b27af8e"
  };
  const app = getApps().length ? getApps()[0] : initializeApp(config);
  db = getFirestore(app);
  fbFn = { collection, addDoc, getDocs, deleteDoc, doc, updateDoc, query, orderBy };
}

// ─── Finnhub live koers ───────────────────────────────────────────────────────
const FINNHUB_KEY = "d8o37fpr01qvtr6m81f0d8o37fpr01qvtr6m81fg";
const priceCache = {};
async function fetchPrice(ticker) {
  if (priceCache[ticker] && Date.now() - priceCache[ticker].ts < 60000) return priceCache[ticker].price;
  try {
    const r = await fetch(`https://finnhub.io/api/v1/quote?symbol=${ticker}&token=${FINNHUB_KEY}`);
    const d = await r.json();
    if (d.c && d.c > 0) { priceCache[ticker] = { price: d.c, ts: Date.now() }; return d.c; }
  } catch (_) {}
  return null;
}
const metricsCache = {};
async function fetchMetrics(ticker) {
  if (metricsCache[ticker] && Date.now() - metricsCache[ticker].ts < 3600000) return metricsCache[ticker].data;
  try {
    const [p, m] = await Promise.all([
      fetch(`https://finnhub.io/api/v1/stock/profile2?symbol=${ticker}&token=${FINNHUB_KEY}`).then(r => r.json()),
      fetch(`https://finnhub.io/api/v1/stock/metric?symbol=${ticker}&metric=all&token=${FINNHUB_KEY}`).then(r => r.json())
    ]);
    const data = { marketCap: p.marketCapitalization ?? null, high52: m.metric?.["52WeekHigh"] ?? null, low52: m.metric?.["52WeekLow"] ?? null };
    metricsCache[ticker] = { data, ts: Date.now() };
    return data;
  } catch (_) { return null; }
}

// ─── Constants & helpers ──────────────────────────────────────────────────────
const BIASES = ["Bullish", "Bearish", "Neutral"];
const BIAS_COLOR = { Bullish: "#22c55e", Bearish: "#ef4444", Neutral: "#94a3b8" };
const SETUPS = ["Breakout", "Breakdown", "H&S", "Reverse H&S", "Support Test", "Resistance Test",
  "Tweezer Top", "Tweezer Bottom", "Shooting Star", "Hammer", "Range",
  "Bollinger Squeeze", "MA Cross", "DMI/ADX", "VIX Signal", "Other"];
const TIMEFRAMES = [
  { id: "1M", label: "Maand", short: "M", color: "#a78bfa" },
  { id: "1W", label: "Week", short: "W", color: "#38bdf8" },
  { id: "1D", label: "Dag", short: "D", color: "#34d399" },
  { id: "4H", label: "4 uur", short: "4H", color: "#fbbf24" },
  { id: "1H", label: "1 uur", short: "1H", color: "#f472b6" },
];
// Oude waarden uit de vorige versie omzetten
const LEGACY_TF = { Monthly: "1M", Weekly: "1W", Daily: "1D" };
const normTf = t => !t ? null : (LEGACY_TF[t] || (TIMEFRAMES.some(x => x.id === t) ? t : null));
const tfInfo = t => TIMEFRAMES.find(x => x.id === normTf(t)) || null;

const CURRENCIES = { USD: "$", EUR: "€", GBP: "£", CHF: "CHF " };
const money = (v, cur) => {
  const n = parseFloat(v);
  return isNaN(n) ? "—" : `${CURRENCIES[cur] ?? "$"}${n.toFixed(2)}`;
};
function formatDate(isoStr) {
  if (!isoStr) return "";
  const [y, m, d] = isoStr.slice(0, 10).split("-");
  return `${d}/${m}/${y}`;
}
function formatDateTime(iso) {
  if (!iso) return "";
  if (iso.length <= 10) return formatDate(iso);
  return new Date(iso).toLocaleDateString("nl-BE", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
}
function pct(a, b) {
  if (!a || !b || isNaN(a) || isNaN(b)) return null;
  return ((b - a) / a * 100).toFixed(2);
}
const signed = p => p === null ? "—" : `${parseFloat(p) >= 0 ? "+" : ""}${p}%`;

// Firestore laat max 1 MiB per document toe; screenshots zitten in het document.
const DOC_LIMIT = 1000000;
const docBytes = obj => new Blob([JSON.stringify(obj)]).size;
function checkSize(obj) {
  const n = docBytes(obj);
  if (n > DOC_LIMIT) throw new Error(`Deze entry wordt te groot (${Math.round(n / 1024)} KB, max ~980 KB). Verwijder een oude screenshot of start een nieuwe entry voor deze ticker.`);
}

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 1200 / img.width);
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      resolve(c.toDataURL("image/jpeg", 0.75));
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}
const imageFromPaste = e => [...(e.clipboardData?.items || [])].find(i => i.type.startsWith("image/"))?.getAsFile() || null;

// Alle charts van een entry als één tijdlijn (startanalyse + updates)
function timelineOf(e) {
  const items = [{ kind: "main", idx: -1, date: e.createdAt || e.date, tf: normTf(e.timeframe), bias: e.bias, note: e.note, imageData: e.imageData }];
  (e.updates ?? []).forEach((u, i) => items.push({ kind: "update", idx: i, date: u.date, tf: normTf(u.timeframe), bias: u.bias || null, note: u.note, imageData: u.imageData }));
  return items.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
}
const lastActivity = e => timelineOf(e)[0]?.date || e.date || "";
const currentBias = e => timelineOf(e).find(i => i.bias)?.bias || e.bias;
const tfsOf = e => TIMEFRAMES.filter(t => timelineOf(e).some(i => i.tf === t.id)).map(t => t.id);

// ?ticker=BRK.B in de URL → enkel die ticker tonen (apart tabblad)
const URL_TICKER = (new URLSearchParams(location.search).get("ticker") || "").trim().toUpperCase() || null;
const tickerUrl = t => `${location.pathname}?ticker=${encodeURIComponent(t)}`;
function TabLink({ ticker }) {
  return html`<a className="tablink" href=${tickerUrl(ticker)} target="_blank" rel="noopener"
    title=${`${ticker} openen in nieuw tabblad`} onClick=${e => e.stopPropagation()}>↗</a>`;
}

// ─── Small components ─────────────────────────────────────────────────────────
function TfBadge({ tf, big }) {
  const t = tfInfo(tf);
  if (!t) return html`<span className="tf" style=${{ color: "#64748b", borderColor: "#334155" }} title="Timeframe niet ingesteld">?</span>`;
  return html`<span className=${"tf" + (big ? " big" : "")} title=${t.label}
    style=${{ color: t.color, borderColor: t.color + "66", background: t.color + "1a" }}>${big ? t.label : t.short}</span>`;
}
const BiasBadge = ({ label }) => label ? html`<span className="bias" style=${{ background: BIAS_COLOR[label] ?? "#334155" }}>${label}</span>` : null;

function TfPicker({ value, onChange }) {
  return html`<div className="seg" role="radiogroup" aria-label="Timeframe">
    ${TIMEFRAMES.map(t => html`<button key=${t.id} type="button" role="radio" aria-checked=${value === t.id}
      className=${value === t.id ? "on" : ""} style=${{ "--c": t.color }} onClick=${() => onChange(t.id)}>${t.label}</button>`)}
  </div>`;
}
function BiasPicker({ value, onChange, allowSame }) {
  const opts = allowSame ? ["", ...BIASES] : BIASES;
  return html`<div className="seg" role="radiogroup" aria-label="Bias">
    ${opts.map(b => html`<button key=${b || "same"} type="button" role="radio" aria-checked=${value === b}
      className=${value === b ? "on" : ""} style=${{ "--c": BIAS_COLOR[b] || "#94a3b8" }} onClick=${() => onChange(b)}>${b || "Ongewijzigd"}</button>`)}
  </div>`;
}

function ImageDrop({ value, onChange, onFile, required }) {
  const ref = useRef();
  const [over, setOver] = useState(false);
  return html`<div>
    <div className=${"drop" + (value ? " has" : "") + (over ? " over" : "")} tabIndex="0" role="button"
      onClick=${() => ref.current.click()}
      onKeyDown=${e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); ref.current.click(); } }}
      onDragOver=${e => { e.preventDefault(); setOver(true); }}
      onDragLeave=${() => setOver(false)}
      onDrop=${e => { e.preventDefault(); setOver(false); onFile(e.dataTransfer.files[0]); }}>
      ${value ? "✓ Screenshot geladen. Klik, sleep of plak om te vervangen." : `📎 Klik, sleep of plak (Ctrl+V) een screenshot${required ? " *" : ""}`}
    </div>
    <input ref=${ref} type="file" accept="image/*" style=${{ display: "none" }}
      onChange=${e => { onFile(e.target.files[0]); e.target.value = ""; }} />
    ${value && html`<div className="thumb-row">
      <img src=${value} className="thumb" alt="Voorbeeld" />
      <button type="button" className="btn danger small" onClick=${() => onChange("")}>✕ Verwijder</button>
    </div>`}
  </div>`;
}

// Gemeenschappelijke logica: screenshot laden via klik, slepen of plakken
function useImage(initial) {
  const [imageData, setImageData] = useState(initial || "");
  async function takeFile(file) {
    if (!file || !file.type.startsWith("image/")) return;
    setImageData(await compressImage(file));
  }
  function onPaste(e) {
    const f = imageFromPaste(e);
    if (f) { e.preventDefault(); takeFile(f); }
  }
  return { imageData, setImageData, takeFile, onPaste };
}

// ─── Update form (nieuw of bewerken) ──────────────────────────────────────────
function UpdateForm({ initial, defaultTf, onSave, onCancel }) {
  const [note, setNote] = useState(initial?.note || "");
  const [tf, setTf] = useState(initial ? (normTf(initial.timeframe) || "") : defaultTf);
  const [bias, setBias] = useState(initial?.bias || "");
  const [busy, setBusy] = useState(false);
  const img = useImage(initial?.imageData);
  const ok = (note.trim() || img.imageData) && tf;

  async function save() {
    setBusy(true);
    const done = await onSave({ note, imageData: img.imageData, timeframe: tf, bias });
    setBusy(false);
    if (done) onCancel();
  }

  return html`<div className="form sub" onPaste=${img.onPaste}>
    <h3>${initial ? "Update bewerken" : "➕ Nieuwe update"}</h3>
    <div className="row">
      <div className="field"><label>Timeframe van deze chart</label><${TfPicker} value=${tf} onChange=${setTf} /></div>
      <div className="field"><label>Bias</label><${BiasPicker} value=${bias} onChange=${setBias} allowSame /></div>
    </div>
    <div className="field" style=${{ marginBottom: 12 }}>
      <label>Notitie</label>
      <textarea className="inp" rows="3" value=${note} onChange=${e => setNote(e.target.value)} placeholder="Wat zie je op deze chart?" />
    </div>
    <div style=${{ marginBottom: 12 }}>
      <${ImageDrop} value=${img.imageData} onChange=${img.setImageData} onFile=${img.takeFile} />
    </div>
    <div className="form-actions">
      <button className="btn primary" disabled=${!ok || busy} onClick=${save}>${busy ? "Opslaan..." : initial ? "Wijziging opslaan" : "Update toevoegen"}</button>
      <button className="btn ghost" onClick=${onCancel}>Annuleer</button>
      ${!tf && html`<span className="hint">Kies een timeframe</span>`}
    </div>
  </div>`;
}

// ─── Move to folder ───────────────────────────────────────────────────────────
function MoveMenu({ entry, allFolders, onMove, onClose }) {
  const [newFolder, setNewFolder] = useState("");
  const current = entry.folder || "Active";
  const options = [...new Set(["Active", "Archief", ...allFolders])];
  const icon = f => f === "Archief" ? "🗄️ " : f === "Active" ? "📌 " : "📁 ";
  return html`<div className="move">
    <div className="hint">Verplaats naar map</div>
    <div style=${{ display: "flex", gap: 6, flexWrap: "wrap" }}>
      ${options.map(f => html`<button key=${f} className=${"chip" + (current === f ? " on" : "")}
        onClick=${() => { onMove(entry, f); onClose(); }}>${icon(f) + f}</button>`)}
    </div>
    <div style=${{ display: "flex", gap: 6 }}>
      <input className="inp" value=${newFolder} onChange=${e => setNewFolder(e.target.value)} placeholder="Nieuwe map..." style=${{ width: 170 }} />
      <button className="btn primary" style=${{ padding: "5px 12px", fontSize: 12 }}
        onClick=${() => { if (newFolder.trim()) { onMove(entry, newFolder.trim()); onClose(); } }}>Aanmaken</button>
    </div>
  </div>`;
}

// ─── Entry card ───────────────────────────────────────────────────────────────
function Level({ label, value, color, sub }) {
  return html`<div>
    <div className="lv-label">${label}</div>
    <div className="lv-val" style=${{ color: color || "#f8fafc" }}>${value}</div>
    ${sub && html`<div className="lv-sub">${sub}</div>`}
  </div>`;
}

function EntryCard({ entry: e, defaultOpen, allFolders, onDelete, onEdit, onMove, onSaveUpdate, onDeleteUpdate, openImage }) {
  const [expanded, setExpanded] = useState(!!defaultOpen);
  const [adding, setAdding] = useState(false);
  const [editingIdx, setEditingIdx] = useState(null);
  const [showMove, setShowMove] = useState(false);
  const [tlFilter, setTlFilter] = useState("all");
  const [livePrice, setLivePrice] = useState(undefined);
  const [metrics, setMetrics] = useState(undefined);

  const cur = e.currency || "USD";
  const folder = e.folder || "Active";
  const items = timelineOf(e);
  const tfs = tfsOf(e);
  const bias = currentBias(e);
  const updates = e.updates ?? [];
  const latestTf = items.find(i => i.tf)?.tf || normTf(e.timeframe) || "1D";

  useEffect(() => {
    if (expanded && e.ticker && livePrice === undefined) {
      fetchPrice(e.ticker).then(setLivePrice);
      fetchMetrics(e.ticker).then(m => setMetrics(m));
    }
  }, [expanded, e.ticker]);

  const entryPrice = parseFloat(e.price), targetPrice = parseFloat(e.target);
  const pnl = livePrice && entryPrice ? pct(entryPrice, livePrice) : null;
  const toTarget = livePrice && targetPrice ? pct(livePrice, targetPrice) : null;
  const pnlColor = pnl === null ? "#94a3b8" : parseFloat(pnl) >= 0 ? "#22c55e" : "#ef4444";
  const loading = v => v === undefined ? "laden..." : "—";

  const shown = tlFilter === "all" ? items : items.filter(i => i.tf === tlFilter);
  const bytes = expanded ? docBytes(e) : 0;
  const usage = Math.round(bytes / DOC_LIMIT * 100);

  return html`<div className=${"card" + (expanded ? " open" : "")}>
    <div className="card-head" role="button" tabIndex="0" aria-expanded=${expanded}
      onClick=${() => setExpanded(v => !v)}
      onKeyDown=${ev => { if (ev.key === "Enter") setExpanded(v => !v); }}>
      <span className="ticker">${e.ticker}</span>
      ${!URL_TICKER && html`<${TabLink} ticker=${e.ticker} />`}
      <span className="date" title="Laatste activiteit">${formatDate(lastActivity(e))}</span>
      <${BiasBadge} label=${bias} />
      <span className="tfs">${tfs.map(t => html`<${TfBadge} key=${t} tf=${t} />`)}</span>
      ${updates.length > 0 && html`<span className="pill" style=${{ color: "#7dd3fc", background: "#1e3a5f" }}>${updates.length} update${updates.length > 1 ? "s" : ""}</span>`}
      ${folder !== "Active" && html`<span className="pill" style=${{ color: "#f59e0b", background: "#3b2a0a" }}>${folder === "Archief" ? "🗄️" : "📁"} ${folder}</span>`}
      <span className="head-right">
        <span className="levels-mini">
          ${e.price && money(e.price, cur)}
          ${e.price && e.target && " → "}
          ${e.target && html`<span style=${{ color: "#22c55e", fontWeight: 600 }}>🎯 ${money(e.target, cur)}</span>`}
        </span>
        <span className="chev">${expanded ? "▲" : "▼"}</span>
      </span>
    </div>

    ${expanded && html`<div className="body">
      <div className="levels">
        <${Level} label="Live koers" value=${livePrice ? money(livePrice, cur) : loading(livePrice)} />
        ${e.price && html`<${Level} label="P&L" value=${signed(pnl)} color=${pnlColor} />`}
        ${e.target && html`<${Level} label="% naar target" value=${signed(toTarget ?? (entryPrice && targetPrice ? pct(entryPrice, targetPrice) : null))} color="#7dd3fc" />`}
        ${e.price && html`<${Level} label="Instap" value=${money(e.price, cur)} />`}
        ${e.target && html`<${Level} label="Target" value=${money(e.target, cur)} color="#22c55e" />`}
        ${e.invalidation && html`<${Level} label="Invalidation" value=${money(e.invalidation, cur)} color="#f97316" sub=${`Ongeldig ${e.invalidationDir || "onder"} dit niveau`} />`}
        <${Level} label="52W high" value=${metrics?.high52 ? money(metrics.high52, cur) : loading(metrics)} color="#22c55e" />
        <${Level} label="52W low" value=${metrics?.low52 ? money(metrics.low52, cur) : loading(metrics)} color="#ef4444" />
      </div>

      ${e.setups?.length > 0 && html`<div className="tags">${e.setups.map(s => html`<span key=${s} className="tag">${s}</span>`)}</div>`}

      <div className="tl-bar">
        <span className="tl-title">Tijdlijn</span>
        <button className=${"chip" + (tlFilter === "all" ? " on" : "")} onClick=${() => setTlFilter("all")}>Alle (${items.length})</button>
        ${tfs.map(t => {
          const info = tfInfo(t);
          const n = items.filter(i => i.tf === t).length;
          return html`<button key=${t} className=${"chip" + (tlFilter === t ? " on" : "")} style=${{ "--c": info.color }}
            onClick=${() => setTlFilter(t)}>${info.label} (${n})</button>`;
        })}
        <span style=${{ marginLeft: "auto" }}>
          ${!adding && html`<button className="btn" onClick=${() => { setAdding(true); setEditingIdx(null); }}>➕ Update toevoegen</button>`}
        </span>
      </div>

      ${adding && html`<${UpdateForm} defaultTf=${latestTf}
        onSave=${u => onSaveUpdate(e, null, u)} onCancel=${() => setAdding(false)} />`}

      ${shown.map(it => {
        const info = tfInfo(it.tf);
        if (it.kind === "update" && editingIdx === it.idx) {
          return html`<${UpdateForm} key=${"edit" + it.idx} initial=${updates[it.idx]} defaultTf=${latestTf}
            onSave=${u => onSaveUpdate(e, it.idx, u)} onCancel=${() => setEditingIdx(null)} />`;
        }
        return html`<div key=${it.kind + it.idx} className="tl-item" style=${{ "--c": info?.color || "#334155" }}>
          <div className="tl-head">
            <${TfBadge} tf=${it.tf} big />
            <span className="tl-date">${formatDateTime(it.date)}</span>
            <${BiasBadge} label=${it.bias} />
            ${it.kind === "main" && html`<span className="tl-kind">Startanalyse</span>`}
            ${it.kind === "update" && html`<span className="tl-actions">
              <button className="btn small" onClick=${() => { setEditingIdx(it.idx); setAdding(false); }}>Bewerk</button>
              <button className="btn small danger" onClick=${() => onDeleteUpdate(e, it.idx)}>Verwijder</button>
            </span>`}
          </div>
          ${it.note && html`<p className="note">${it.note}</p>`}
          ${it.imageData && html`<img className="shot" src=${it.imageData} alt=${`${e.ticker} ${info?.label || ""} chart`} onClick=${() => openImage(it.imageData)} />`}
        </div>`;
      })}

      <div className="actions">
        <button className="btn" onClick=${() => onEdit(e)}>Startanalyse bewerken</button>
        <button className="btn warn" onClick=${() => setShowMove(v => !v)}>📁 Verplaats</button>
        <button className="btn danger" onClick=${() => onDelete(e)}>Verwijder entry</button>
        <span className=${"usage" + (usage >= 80 ? " high" : "")} title="Firestore laat max ~1 MB per entry toe">Opslag ${usage}%</span>
      </div>
      ${showMove && html`<${MoveMenu} entry=${e} allFolders=${allFolders} onMove=${onMove} onClose=${() => setShowMove(false)} />`}
    </div>`}
  </div>`;
}

// ─── Entry form (startanalyse) ────────────────────────────────────────────────
function EntryForm({ initial, defaultTicker, onSave, onCancel, saving }) {
  const blank = { ticker: defaultTicker || "", date: new Date().toISOString().slice(0, 10), price: "", target: "", currency: "USD", bias: "Bullish", timeframe: "1D", setups: [], note: "", invalidation: "", invalidationDir: "onder" };
  const [form, setForm] = useState(initial ? { currency: "USD", ...initial, timeframe: normTf(initial.timeframe) || "1D" } : blank);
  const img = useImage(initial?.imageData);
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const toggleSetup = s => set("setups", form.setups.includes(s) ? form.setups.filter(x => x !== s) : [...form.setups, s]);
  const canSave = form.ticker && img.imageData;

  return html`<div className="form" onPaste=${img.onPaste}>
    <h3>${initial ? "Startanalyse bewerken" : "Nieuwe analyse"}</h3>
    <div className="row">
      <div className="field"><label>Ticker</label>
        <input className="inp" style=${{ width: 100 }} value=${form.ticker} onChange=${e => set("ticker", e.target.value.toUpperCase())} placeholder="BRK.B" /></div>
      <div className="field"><label>Datum</label>
        <input className="inp" type="date" style=${{ width: 145 }} value=${form.date} onChange=${e => set("date", e.target.value)} /></div>
      <div className="field"><label>Valuta</label>
        <select className="inp" style=${{ width: 80 }} value=${form.currency} onChange=${e => set("currency", e.target.value)}>
          ${Object.keys(CURRENCIES).map(c => html`<option key=${c}>${c}</option>`)}
        </select></div>
      <div className="field"><label>Instapprijs</label>
        <input className="inp" type="number" style=${{ width: 100 }} value=${form.price} onChange=${e => set("price", e.target.value)} placeholder="504.12" /></div>
      <div className="field"><label>Target</label>
        <input className="inp" type="number" style=${{ width: 100 }} value=${form.target} onChange=${e => set("target", e.target.value)} placeholder="542.16" /></div>
      <div className="field"><label>Invalidation</label>
        <input className="inp" type="number" style=${{ width: 100 }} value=${form.invalidation} onChange=${e => set("invalidation", e.target.value)} placeholder="495.00" /></div>
      <div className="field"><label>Ongeldig</label>
        <select className="inp" style=${{ width: 90 }} value=${form.invalidationDir} onChange=${e => set("invalidationDir", e.target.value)}>
          <option value="onder">Onder</option><option value="boven">Boven</option>
        </select></div>
    </div>
    <div className="row">
      <div className="field"><label>Timeframe van de chart</label><${TfPicker} value=${form.timeframe} onChange=${v => set("timeframe", v)} /></div>
      <div className="field"><label>Bias</label><${BiasPicker} value=${form.bias} onChange=${v => set("bias", v)} /></div>
    </div>
    <div className="field" style=${{ marginBottom: 14 }}>
      <label>Setup tags</label>
      <div style=${{ display: "flex", gap: 6, flexWrap: "wrap" }}>
        ${SETUPS.map(s => html`<button key=${s} type="button" className=${"chip" + (form.setups.includes(s) ? " on" : "")} onClick=${() => toggleSetup(s)}>${s}</button>`)}
      </div>
    </div>
    <div className="field" style=${{ marginBottom: 14 }}>
      <label>Notitie</label>
      <textarea className="inp" rows="3" value=${form.note} onChange=${e => set("note", e.target.value)} placeholder="Range 453,6–542,16. Shooting star augustus..." />
    </div>
    <div className="field" style=${{ marginBottom: 18 }}>
      <label>Chart screenshot (verplicht)</label>
      <${ImageDrop} value=${img.imageData} onChange=${img.setImageData} onFile=${img.takeFile} required />
    </div>
    <div className="form-actions">
      <button className="btn primary" disabled=${saving || !canSave} onClick=${() => onSave({ ...form, imageData: img.imageData })}>${saving ? "Opslaan..." : "Opslaan"}</button>
      <button className="btn ghost" onClick=${onCancel}>Annuleer</button>
      ${!canSave && html`<span className="hint">Ticker en screenshot zijn verplicht</span>`}
    </div>
  </div>`;
}

// ─── Main app ─────────────────────────────────────────────────────────────────
function App() {
  const [entries, setEntries] = useState([]);
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [showForm, setShowForm] = useState(false);
  const [editEntry, setEditEntry] = useState(null);
  const [search, setSearch] = useState("");
  const [filterBias, setFilterBias] = useState("All");
  const [filterSetup, setFilterSetup] = useState("All");
  const [filterTf, setFilterTf] = useState("All");
  const [filterFolder, setFilterFolder] = useState(URL_TICKER ? "Alle" : "Active");
  const [groupByTicker, setGroupByTicker] = useState(true);
  const [lightbox, setLightbox] = useState(null);
  const [error, setError] = useState("");

  useEffect(() => { if (URL_TICKER) document.title = `${URL_TICKER} · Trade Journal`; }, []);
  useEffect(() => { initFirebase().then(loadEntries).catch(e => { setError(e.message); setLoading(false); }); }, []);
  useEffect(() => {
    const onKey = e => { if (e.key === "Escape") setLightbox(null); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  async function loadEntries() {
    try {
      const { collection, getDocs, query, orderBy } = fbFn;
      const snap = await getDocs(query(collection(db, "trade_journal"), orderBy("date", "desc")));
      setEntries(snap.docs.map(d => ({ id: d.id, ...d.data() })));
    } catch (e) { setError(e.message); } finally { setLoading(false); }
  }

  async function handleSave(form) {
    setSaving(true); setError("");
    try {
      const payload = {
        ticker: form.ticker.trim().toUpperCase(), date: form.date,
        price: form.price || "", target: form.target || "", currency: form.currency || "USD",
        bias: form.bias, timeframe: form.timeframe, setups: form.setups,
        note: form.note, imageData: form.imageData || "",
        invalidation: form.invalidation || "", invalidationDir: form.invalidationDir || "onder",
        updates: form.updates || [],
        updatedAt: new Date().toISOString(),
      };
      if (editEntry) {
        checkSize({ ...editEntry, ...payload });
        await fbFn.updateDoc(fbFn.doc(db, "trade_journal", editEntry.id), payload);
        setEntries(es => es.map(e => e.id === editEntry.id ? { ...e, ...payload } : e));
      } else {
        payload.createdAt = new Date().toISOString();
        checkSize(payload);
        const ref = await fbFn.addDoc(fbFn.collection(db, "trade_journal"), payload);
        setEntries(es => [{ id: ref.id, ...payload }, ...es]);
      }
      setShowForm(false); setEditEntry(null);
    } catch (e) { setError(e.message); } finally { setSaving(false); }
  }

  async function handleDelete(entry) {
    if (!confirm(`Verwijder ${entry.ticker} (${formatDate(entry.date)}) met alle updates?`)) return;
    try {
      await fbFn.deleteDoc(fbFn.doc(db, "trade_journal", entry.id));
      setEntries(es => es.filter(e => e.id !== entry.id));
    } catch (e) { setError(e.message); }
  }

  async function handleMove(entry, folder) {
    try {
      await fbFn.updateDoc(fbFn.doc(db, "trade_journal", entry.id), { folder });
      setEntries(es => es.map(e => e.id === entry.id ? { ...e, folder } : e));
    } catch (e) { setError(e.message); }
  }

  async function writeUpdates(entry, updates) {
    checkSize({ ...entry, updates });
    const updatedAt = new Date().toISOString();
    await fbFn.updateDoc(fbFn.doc(db, "trade_journal", entry.id), { updates, updatedAt });
    setEntries(es => es.map(e => e.id === entry.id ? { ...e, updates, updatedAt } : e));
  }

  // idx === null → nieuwe update, anders bestaande bewerken
  async function handleSaveUpdate(entry, idx, upd) {
    setError("");
    try {
      const updates = [...(entry.updates ?? [])];
      const clean = { note: upd.note, imageData: upd.imageData || "", timeframe: upd.timeframe, bias: upd.bias || "" };
      if (idx === null) updates.push({ ...clean, date: new Date().toISOString() });
      else updates[idx] = { ...updates[idx], ...clean, editedAt: new Date().toISOString() };
      await writeUpdates(entry, updates);
      return true;
    } catch (e) { setError(e.message); return false; }
  }

  async function handleDeleteUpdate(entry, idx) {
    if (!confirm("Deze update verwijderen?")) return;
    setError("");
    try { await writeUpdates(entry, (entry.updates ?? []).filter((_, i) => i !== idx)); }
    catch (e) { setError(e.message); }
  }

  function handleEdit(entry) { setEditEntry(entry); setShowForm(true); window.scrollTo({ top: 0, behavior: "smooth" }); }

  const allFolders = [...new Set(entries.map(e => e.folder || "Active"))];
  const folderOptions = [...new Set(["Active", "Archief", ...allFolders])];
  const folderIcon = f => f === "Archief" ? "🗄️ " : f === "Active" ? "📌 " : "📁 ";

  const filtered = entries.filter(e => {
    const s = search.trim().toLowerCase();
    const text = [e.ticker, e.note, ...(e.updates ?? []).map(u => u.note)].join(" ").toLowerCase();
    return (!URL_TICKER || e.ticker === URL_TICKER)
      && (!s || text.includes(s))
      && (filterBias === "All" || currentBias(e) === filterBias)
      && (filterSetup === "All" || (e.setups ?? []).includes(filterSetup))
      && (filterTf === "All" || tfsOf(e).includes(filterTf))
      && (filterFolder === "Alle" || (e.folder || "Active") === filterFolder);
  }).sort((a, b) => lastActivity(b).localeCompare(lastActivity(a)));

  const tickers = [...new Set(filtered.map(e => e.ticker))].sort();
  const card = (e, i) => html`<${EntryCard} key=${e.id} entry=${e} defaultOpen=${!!URL_TICKER && i === 0} allFolders=${allFolders}
    onDelete=${handleDelete} onEdit=${handleEdit} onMove=${handleMove}
    onSaveUpdate=${handleSaveUpdate} onDeleteUpdate=${handleDeleteUpdate} openImage=${setLightbox} />`;

  return html`<div>
    <div className="header">
      <div>
        <span className="brand">📈 ${URL_TICKER || "Trade Journal"}</span>
        <span className="count">${URL_TICKER ? `${filtered.length} ${filtered.length === 1 ? "entry" : "entries"}` : `${entries.length} analyses`}</span>
        ${URL_TICKER && html`<a className="crumb" href=${location.pathname}>← Alle tickers</a>`}
      </div>
      <button className="btn primary" onClick=${() => { setEditEntry(null); setShowForm(v => !v); }}>
        ${showForm && !editEntry ? "✕ Annuleer" : "+ Nieuwe analyse"}
      </button>
    </div>

    <div className="wrap">
      ${error && html`<div className="error"><span>⚠️ ${error}</span><button className="btn small ghost" onClick=${() => setError("")}>✕</button></div>`}
      ${showForm && html`<${EntryForm} key=${editEntry?.id || "new"} initial=${editEntry} defaultTicker=${URL_TICKER} saving=${saving} onSave=${handleSave}
        onCancel=${() => { setShowForm(false); setEditEntry(null); }} />`}

      <div className="toolbar">
        <input className="inp search" value=${search} onChange=${e => setSearch(e.target.value)} placeholder=${URL_TICKER ? "🔍 Zoek in notities..." : "🔍 Zoek ticker of notitie..."} />
        <select className="inp" value=${filterTf} onChange=${e => setFilterTf(e.target.value)}>
          <option value="All">Alle timeframes</option>
          ${TIMEFRAMES.map(t => html`<option key=${t.id} value=${t.id}>${t.label}</option>`)}
        </select>
        <select className="inp" value=${filterBias} onChange=${e => setFilterBias(e.target.value)}>
          <option value="All">Alle biases</option>
          ${BIASES.map(b => html`<option key=${b}>${b}</option>`)}
        </select>
        <select className="inp" value=${filterSetup} onChange=${e => setFilterSetup(e.target.value)}>
          <option value="All">Alle setups</option>
          ${SETUPS.map(s => html`<option key=${s}>${s}</option>`)}
        </select>
        <select className="inp" value=${filterFolder} onChange=${e => setFilterFolder(e.target.value)}>
          ${folderOptions.map(f => html`<option key=${f} value=${f}>${folderIcon(f) + f}</option>`)}
          <option value="Alle">Alle mappen</option>
        </select>
        <button className="btn" onClick=${() => setGroupByTicker(v => !v)}>${groupByTicker ? "Groep: ticker" : "Groep: datum"}</button>
      </div>

      ${loading ? html`<div className="empty">Verbinden met Firebase...</div>`
        : filtered.length === 0 ? html`<div className="empty">${entries.length === 0 ? "Nog geen analyses. Klik op + Nieuwe analyse om te beginnen." : "Geen resultaten voor deze filters."}</div>`
        : groupByTicker ? tickers.map(t => {
            const group = filtered.filter(e => e.ticker === t);
            return html`<div key=${t}>
              <div className="group-head"><span className="name">${t}</span>${!URL_TICKER && html`<${TabLink} ticker=${t} />`}<span className="rule"></span><span className="n">${group.length} ${group.length === 1 ? "entry" : "entries"}</span></div>
              ${group.map(card)}
            </div>`;
          })
        : filtered.map(card)}
    </div>

    ${lightbox && html`<div className="lightbox" onClick=${() => setLightbox(null)} role="dialog" aria-label="Chart vergroot">
      <img src=${lightbox} alt="Chart" />
    </div>`}
  </div>`;
}

createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
